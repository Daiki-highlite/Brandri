<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Zen Kaku Gothic New', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#F4F4F4"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left zone (before open) -->
    <rect x="90" y="230" width="490" height="220" fill="#9B8CC8" fill-opacity="0.12" stroke="none"/>
    <!-- Right zone (after open) -->
    <rect x="620" y="230" width="490" height="220" fill="#7BBAD4" fill-opacity="0.12" stroke="none"/>

    <!-- Timeline -->
    <line x1="90" y1="340" x2="1110" y2="340" stroke="#1E2340" stroke-width="3"/>
    <path d="M1092 330 L1116 340 L1092 350 Z" fill="#1E2340"/>
    <text x="1110" y="392" text-anchor="end" font-size="22" fill="#3D5070">時間</text>

    <!-- Open marker in the center -->
    <line x1="600" y1="180" x2="600" y2="470" stroke="#1E2340" stroke-width="3"/>
    <circle cx="600" cy="340" r="16" fill="#F4F4F4" stroke="#1E2340" stroke-width="3"/>
    <rect x="510" y="130" width="180" height="52" fill="#1E2340" fill-opacity="0.12" stroke="#1E2340" stroke-width="2.5"/>
    <text x="600" y="166" text-anchor="middle" font-size="28" fill="#1E2340" font-weight="600">開店</text>

    <!-- Left label -->
    <text x="335" y="285" text-anchor="middle" font-size="24" fill="#3D5070">開店前</text>
    <text x="335" y="405" text-anchor="middle" font-size="30" fill="#1E2340" font-weight="600">ブランディング</text>
    <text x="335" y="440" text-anchor="middle" font-size="22" fill="#3D5070">何屋にするか</text>

    <!-- Right label -->
    <text x="865" y="285" text-anchor="middle" font-size="24" fill="#3D5070">開店後</text>
    <text x="865" y="405" text-anchor="middle" font-size="30" fill="#1E2340" font-weight="600">マーケ・広告・PR</text>
    <text x="865" y="440" text-anchor="middle" font-size="22" fill="#3D5070">どう呼ぶか</text>
  </g>
</svg>
