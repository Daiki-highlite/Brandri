<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Zen Kaku Gothic New', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#F4F4F4"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Axes -->
    <line x1="150" y1="120" x2="150" y2="540" stroke="#1E2340" stroke-width="3"/>
    <line x1="150" y1="540" x2="1080" y2="540" stroke="#1E2340" stroke-width="3"/>
    <path d="M1062 530 L1086 540 L1062 550 Z" fill="#1E2340"/>
    <path d="M140 138 L150 114 L160 138 Z" fill="#1E2340"/>
    <text x="1080" y="580" text-anchor="end" font-size="22" fill="#3D5070">時間</text>
    <text x="150" y="100" text-anchor="middle" font-size="22" fill="#3D5070">効果</text>

    <!-- Investment area (rises first) -->
    <path d="M150 540 L260 420 L420 300 L620 240 L860 215 L1030 205 L1030 540 Z"
          fill="#9B8CC8" fill-opacity="0.14" stroke="none"/>
    <path d="M150 540 L260 420 L420 300 L620 240 L860 215 L1030 205"
          fill="none" stroke="#9B8CC8" stroke-width="3.5"/>

    <!-- Effect curve (rises later) -->
    <path d="M150 540 L360 530 L520 480 L700 360 L880 270 L1030 235 L1030 540 Z"
          fill="#7BBAD4" fill-opacity="0.18" stroke="none"/>
    <path d="M150 540 L360 530 L520 480 L700 360 L880 270 L1030 235"
          fill="none" stroke="#7BBAD4" stroke-width="3.5"/>

    <!-- labels -->
    <text x="330" y="365" font-size="26" fill="#1E2340">投資</text>
    <line x1="325" y1="378" x2="355" y2="330" stroke="#9B8CC8" stroke-width="2.5"/>
    <text x="720" y="470" font-size="26" fill="#1E2340">効果</text>
    <line x1="715" y1="455" x2="690" y2="405" stroke="#7BBAD4" stroke-width="2.5"/>

    <!-- Time-lag indicator -->
    <g>
      <line x1="420" y1="300" x2="420" y2="180" stroke="#3D5070" stroke-width="1.8" stroke-dasharray="5 6"/>
      <line x1="700" y1="360" x2="700" y2="180" stroke="#3D5070" stroke-width="1.8" stroke-dasharray="5 6"/>
      <line x1="420" y1="190" x2="700" y2="190" stroke="#3D5070" stroke-width="2.5"/>
      <path d="M430 181 L406 190 L430 199 Z" fill="#3D5070"/>
      <path d="M690 181 L714 190 L690 199 Z" fill="#3D5070"/>
      <text x="560" y="170" text-anchor="middle" font-size="24" fill="#1E2340">タイムラグ（遅れ）</text>
    </g>
  </g>
</svg>
