<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Zen Kaku Gothic New', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#F4F4F4"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Roads: one trunk splitting into three -->
    <g fill="none" stroke="#3D5070" stroke-width="30" stroke-opacity="0.16">
      <path d="M600 620 L600 430"/>
      <path d="M600 430 C 600 340, 300 340, 240 220"/>
      <path d="M600 430 C 600 300, 600 300, 600 200"/>
      <path d="M600 430 C 600 340, 900 340, 960 220"/>
    </g>
    <!-- centre dashed lane -->
    <g fill="none" stroke="#3D5070" stroke-width="2.5" stroke-dasharray="10 14">
      <path d="M600 620 L600 430"/>
      <path d="M600 430 C 600 340, 300 340, 240 220"/>
      <path d="M600 430 C 600 300, 600 300, 600 200"/>
      <path d="M600 430 C 600 340, 900 340, 960 220"/>
    </g>

    <!-- Current-location pin at the fork -->
    <g transform="translate(600 470)">
      <path d="M0 0 C -26 -34, -26 -60, 0 -78 C 26 -60, 26 -34, 0 0 Z"
            fill="#9B8CC8" fill-opacity="0.30" stroke="#1E2340" stroke-width="2.5"/>
      <circle cx="0" cy="-52" r="12" fill="#F4F4F4" stroke="#1E2340" stroke-width="2.5"/>
      <text x="0" y="34" text-anchor="middle" font-size="20" fill="#3D5070">現在地</text>
    </g>

    <!-- Signboards -->
    <!-- left -->
    <g transform="translate(240 180)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#1E2340" stroke-width="3"/>
      <rect x="-135" y="-52" width="270" height="76" fill="#7BBAD4" fill-opacity="0.16" stroke="#1E2340" stroke-width="2.5"/>
      <text x="0" y="-20" text-anchor="middle" font-size="26" fill="#1E2340" font-weight="600">Build</text>
      <text x="0" y="10" text-anchor="middle" font-size="20" fill="#3D5070">0から作る</text>
    </g>
    <!-- center -->
    <g transform="translate(600 160)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#1E2340" stroke-width="3"/>
      <rect x="-135" y="-52" width="270" height="76" fill="#9B8CC8" fill-opacity="0.16" stroke="#1E2340" stroke-width="2.5"/>
      <text x="0" y="-20" text-anchor="middle" font-size="26" fill="#1E2340" font-weight="600">Grow</text>
      <text x="0" y="10" text-anchor="middle" font-size="20" fill="#3D5070">成長中に整える</text>
    </g>
    <!-- right -->
    <g transform="translate(960 180)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#1E2340" stroke-width="3"/>
      <rect x="-135" y="-52" width="270" height="76" fill="#C8A4C4" fill-opacity="0.18" stroke="#1E2340" stroke-width="2.5"/>
      <text x="0" y="-20" text-anchor="middle" font-size="26" fill="#1E2340" font-weight="600">Renew</text>
      <text x="0" y="10" text-anchor="middle" font-size="20" fill="#3D5070">刷新する</text>
    </g>
  </g>
</svg>
