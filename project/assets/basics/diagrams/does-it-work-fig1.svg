<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Zen Kaku Gothic New', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#F4F4F4"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Five gauges evenly spaced: centers x = 175, 388, 600, 812, 1025 ; cy = 300 -->

    <!-- 1 -->
    <g transform="translate(175 300)">
      <path d="M-70 0 A70 70 0 0 1 70 0" fill="none" stroke="#3D5070" stroke-opacity="0.35" stroke-width="14"/>
      <path d="M-70 0 A70 70 0 0 1 34 -61" fill="none" stroke="#7BBAD4" stroke-width="14"/>
      <line x1="0" y1="0" x2="30" y2="-55" stroke="#1E2340" stroke-width="4"/>
      <circle r="8" fill="#1E2340"/>
    </g>
    <text x="175" y="365" text-anchor="middle" font-size="23" fill="#1E2340">知られているか</text>

    <!-- 2 -->
    <g transform="translate(388 300)">
      <path d="M-70 0 A70 70 0 0 1 70 0" fill="none" stroke="#3D5070" stroke-opacity="0.35" stroke-width="14"/>
      <path d="M-70 0 A70 70 0 0 1 -8 -70" fill="none" stroke="#9B8CC8" stroke-width="14"/>
      <line x1="0" y1="0" x2="-8" y2="-62" stroke="#1E2340" stroke-width="4"/>
      <circle r="8" fill="#1E2340"/>
    </g>
    <text x="388" y="365" text-anchor="middle" font-size="23" fill="#1E2340">思い出されるか</text>

    <!-- 3 -->
    <g transform="translate(600 300)">
      <path d="M-70 0 A70 70 0 0 1 70 0" fill="none" stroke="#3D5070" stroke-opacity="0.35" stroke-width="14"/>
      <path d="M-70 0 A70 70 0 0 1 50 -49" fill="none" stroke="#7BBAD4" stroke-width="14"/>
      <line x1="0" y1="0" x2="44" y2="-44" stroke="#1E2340" stroke-width="4"/>
      <circle r="8" fill="#1E2340"/>
    </g>
    <text x="600" y="365" text-anchor="middle" font-size="23" fill="#1E2340">指名されるか</text>

    <!-- 4 -->
    <g transform="translate(812 300)">
      <path d="M-70 0 A70 70 0 0 1 70 0" fill="none" stroke="#3D5070" stroke-opacity="0.35" stroke-width="14"/>
      <path d="M-70 0 A70 70 0 0 1 24 -66" fill="none" stroke="#8CC4D0" stroke-width="14"/>
      <line x1="0" y1="0" x2="20" y2="-59" stroke="#1E2340" stroke-width="4"/>
      <circle r="8" fill="#1E2340"/>
    </g>
    <text x="812" y="365" text-anchor="middle" font-size="23" fill="#1E2340">値引きされないか</text>

    <!-- 5 -->
    <g transform="translate(1025 300)">
      <path d="M-70 0 A70 70 0 0 1 70 0" fill="none" stroke="#3D5070" stroke-opacity="0.35" stroke-width="14"/>
      <path d="M-70 0 A70 70 0 0 1 -34 -61" fill="none" stroke="#C8A4C4" stroke-width="14"/>
      <line x1="0" y1="0" x2="-30" y2="-55" stroke="#1E2340" stroke-width="4"/>
      <circle r="8" fill="#1E2340"/>
    </g>
    <text x="1025" y="365" text-anchor="middle" font-size="23" fill="#1E2340">紹介されるか</text>
  </g>
</svg>
