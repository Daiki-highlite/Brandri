<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Zen Kaku Gothic New', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#F4F4F4"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left: five fragments scattered -->
    <g>
      <rect x="90" y="150" width="120" height="90" rx="0" fill="#9B8CC8" fill-opacity="0.28" stroke="#1E2340" stroke-width="2.5" transform="rotate(-6 150 195)"/>
      <rect x="120" y="290" width="120" height="90" fill="#7BBAD4" fill-opacity="0.28" stroke="#1E2340" stroke-width="2.5" transform="rotate(4 180 335)"/>
      <rect x="90" y="430" width="120" height="90" fill="#8CC4D0" fill-opacity="0.28" stroke="#1E2340" stroke-width="2.5" transform="rotate(-3 150 475)"/>
      <rect x="250" y="200" width="120" height="90" fill="#C8A4C4" fill-opacity="0.28" stroke="#1E2340" stroke-width="2.5" transform="rotate(7 310 245)"/>
      <!-- missing / colorless fragment -->
      <rect x="250" y="380" width="120" height="90" fill="#F4F4F4" stroke="#1E2340" stroke-width="2.5" stroke-dasharray="8 8" transform="rotate(-5 310 425)"/>
    </g>
    <text x="235" y="600" text-anchor="middle" font-size="26" fill="#1E2340">接点の小片</text>

    <!-- Arrow to the whole -->
    <g fill="none" stroke="#3D5070" stroke-width="2.5">
      <path d="M420 337 L560 337"/>
    </g>
    <path d="M552 328 L574 337 L552 346 Z" fill="#3D5070"/>

    <!-- Right: assembled image, blurred / cracked from the missing piece -->
    <g transform="translate(830 337)">
      <!-- soft fade behind -->
      <circle r="160" fill="#9B8CC8" fill-opacity="0.05"/>
      <g opacity="0.9">
        <path d="M0 -150 L60 -110 L60 -20 L0 20 L-60 -20 L-60 -110 Z"
              fill="#9B8CC8" fill-opacity="0.22" stroke="#1E2340" stroke-width="2.5"/>
        <path d="M0 20 L60 -20 L120 40 L60 120 L-40 120 L-100 60 L-60 -20 Z"
              fill="#7BBAD4" fill-opacity="0.20" stroke="#1E2340" stroke-width="2.5"/>
      </g>
      <!-- crack across the whole -->
      <path d="M20 -140 L-10 -40 L40 30 L-30 120"
            fill="none" stroke="#C8A4C4" stroke-width="3.5"/>
      <!-- fading / blurred right edge (dashed lightening) -->
      <path d="M90 -60 L150 -30 M100 10 L160 40 M80 90 L140 120"
            fill="none" stroke="#3D5070" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="4 10"/>
    </g>
    <text x="830" y="600" text-anchor="middle" font-size="26" fill="#1E2340">ちぐはぐで、像がぼやける</text>
  </g>
</svg>
