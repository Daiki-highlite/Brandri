<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Zen Kaku Gothic New', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#F4F4F4"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Failure route (top) -->
    <g>
      <circle cx="150" cy="200" r="30" fill="#C8A4C4" fill-opacity="0.30" stroke="#C8A4C4" stroke-width="3"/>
      <path d="M138 188 L162 212 M162 188 L138 212" stroke="#C8A4C4" stroke-width="3.5"/>

      <rect x="230" y="155" width="250" height="90" fill="#C8A4C4" fill-opacity="0.14" stroke="#C8A4C4" stroke-width="2.5"/>
      <text x="355" y="210" text-anchor="middle" font-size="28" fill="#1E2340">見た目</text>

      <g fill="none" stroke="#C8A4C4" stroke-width="2.5">
        <path d="M480 200 L560 200"/>
      </g>
      <path d="M552 191 L574 200 L552 209 Z" fill="#C8A4C4"/>

      <rect x="600" y="155" width="360" height="90" fill="#C8A4C4" fill-opacity="0.14" stroke="#C8A4C4" stroke-width="2.5"/>
      <text x="780" y="200" text-anchor="middle" font-size="26" fill="#1E2340">？</text>
      <text x="780" y="228" text-anchor="middle" font-size="20" fill="#3D5070">何屋か答えられない</text>
    </g>

    <!-- divider -->
    <line x1="90" y1="337" x2="1110" y2="337" stroke="#3D5070" stroke-width="1.5" stroke-dasharray="6 8"/>

    <!-- Success route (bottom) -->
    <g>
      <circle cx="150" cy="475" r="30" fill="#7BBAD4" fill-opacity="0.30" stroke="#7BBAD4" stroke-width="3"/>
      <path d="M136 476 L147 488 L166 462" fill="none" stroke="#7BBAD4" stroke-width="3.5"/>

      <rect x="210" y="430" width="230" height="90" fill="#7BBAD4" fill-opacity="0.16" stroke="#7BBAD4" stroke-width="2.5"/>
      <text x="325" y="475" text-anchor="middle" font-size="26" fill="#1E2340">約束</text>
      <text x="325" y="505" text-anchor="middle" font-size="19" fill="#3D5070">一行で</text>

      <g fill="none" stroke="#7BBAD4" stroke-width="2.5"><path d="M440 475 L510 475"/></g>
      <path d="M502 466 L524 475 L502 484 Z" fill="#7BBAD4"/>

      <rect x="550" y="430" width="230" height="90" fill="#7BBAD4" fill-opacity="0.16" stroke="#7BBAD4" stroke-width="2.5"/>
      <text x="665" y="483" text-anchor="middle" font-size="26" fill="#1E2340">振る舞い</text>

      <g fill="none" stroke="#7BBAD4" stroke-width="2.5"><path d="M780 475 L850 475"/></g>
      <path d="M842 466 L864 475 L842 484 Z" fill="#7BBAD4"/>

      <rect x="890" y="430" width="220" height="90" fill="#7BBAD4" fill-opacity="0.16" stroke="#7BBAD4" stroke-width="2.5"/>
      <text x="1000" y="483" text-anchor="middle" font-size="26" fill="#1E2340">見た目</text>
    </g>
  </g>
</svg>
