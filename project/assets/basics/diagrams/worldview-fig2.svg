<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Zen Kaku Gothic New', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#F4F4F4"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(600 337)">
      <!-- concentric rings -->
      <circle r="300" fill="#8CC4D0" fill-opacity="0.07" stroke="#3D5070" stroke-width="2"/>
      <circle r="230" fill="#C8A4C4" fill-opacity="0.09" stroke="#3D5070" stroke-width="2"/>
      <circle r="160" fill="#7BBAD4" fill-opacity="0.11" stroke="#3D5070" stroke-width="2"/>
      <circle r="92"  fill="#9B8CC8" fill-opacity="0.16" stroke="#1E2340" stroke-width="2.5"/>

      <!-- core label -->
      <text x="0" y="-6" text-anchor="middle" font-size="26" fill="#1E2340" font-weight="600">核</text>
      <text x="0" y="26" text-anchor="middle" font-size="20" fill="#3D5070">約束（一行）</text>

      <!-- ring labels along top of each ring -->
      <text x="0" y="-118" text-anchor="middle" font-size="24" fill="#1E2340">言葉</text>
      <text x="0" y="-188" text-anchor="middle" font-size="24" fill="#1E2340">態度</text>
      <text x="0" y="-258" text-anchor="middle" font-size="24" fill="#1E2340">見た目</text>
      <text x="0" y="284"  text-anchor="middle" font-size="24" fill="#1E2340">価格</text>
    </g>
  </g>
</svg>
