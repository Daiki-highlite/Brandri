<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Zen Kaku Gothic New', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#F4F4F4"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Three upper layer blocks -->
    <g>
      <rect x="270" y="150" width="660" height="90" fill="#7BBAD4" fill-opacity="0.18" stroke="#1E2340" stroke-width="2.5"/>
      <text x="600" y="205" text-anchor="middle" font-size="30" fill="#1E2340">マーケティング</text>

      <rect x="270" y="255" width="660" height="90" fill="#9B8CC8" fill-opacity="0.16" stroke="#1E2340" stroke-width="2.5"/>
      <text x="600" y="310" text-anchor="middle" font-size="30" fill="#1E2340">広告</text>

      <rect x="270" y="360" width="660" height="90" fill="#C8A4C4" fill-opacity="0.20" stroke="#1E2340" stroke-width="2.5"/>
      <text x="600" y="415" text-anchor="middle" font-size="30" fill="#1E2340">PR</text>
    </g>

    <!-- Foundation bar -->
    <rect x="180" y="480" width="840" height="120" fill="#1E2340" fill-opacity="0.12" stroke="#1E2340" stroke-width="3"/>
    <text x="600" y="530" text-anchor="middle" font-size="30" fill="#1E2340" font-weight="600">ブランディング</text>
    <text x="600" y="570" text-anchor="middle" font-size="24" fill="#3D5070">＝何屋で、何を約束するか</text>

    <!-- ground line -->
    <line x1="140" y1="600" x2="1060" y2="600" stroke="#1E2340" stroke-width="2.5"/>
  </g>
</svg>
