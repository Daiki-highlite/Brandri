  <!-- 5つの目盛り -->
  <path d="M28 82 L34 79 M38 62 L43 65 M60 54 L60 60 M82 62 L77 65 M92 82 L86 79"
        stroke="#FAF6EC" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <!-- 針（右上へ） -->
  <path d="M60 84 L78 60" stroke="#9B8CC8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="84" r="5" fill="#9B8CC8"/>
  <circle cx="60" cy="84" r="2" fill="#1E2340"/>
</svg>
