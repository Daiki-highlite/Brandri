<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 大量に生成された案（点群）が一本の基準の線に向かい、通過するのはごく少数（AIと判断基準） -->
  <defs>
    <linearGradient id="bg3" gradientTransform="rotate(34)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="58%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8CC4D0" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#7BBAD4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="chosen">
      <stop offset="0%" stop-color="rgba(250,246,236,0.95)"/>
      <stop offset="60%" stop-color="#8CC4D0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8CC4D0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg3)"/>

  <!-- 生成された案の群れ（左側に密集） -->
  <g fill="#9B8CC8" opacity="0.5">
    <circle cx="72" cy="128" r="9"/><circle cx="150" cy="248" r="6"/><circle cx="104" cy="372" r="11"/>
    <circle cx="196" cy="90" r="5"/><circle cx="232" cy="330" r="8"/><circle cx="88" cy="520" r="7"/>
    <circle cx="176" cy="600" r="10"/><circle cx="268" cy="196" r="6"/><circle cx="300" cy="470" r="9"/>
    <circle cx="128" cy="676" r="5"/><circle cx="248" cy="638" r="7"/><circle cx="60" cy="288" r="5"/>
  </g>
  <g fill="#C8A4C4" opacity="0.45">
    <circle cx="340" cy="120" r="7"/><circle cx="372" cy="300" r="10"/><circle cx="318" cy="576" r="6"/>
    <circle cx="404" cy="196" r="5"/><circle cx="430" cy="452" r="8"/><circle cx="356" cy="676" r="9"/>
    <circle cx="286" cy="384" r="4"/><circle cx="412" cy="604" r="5"/>
  </g>
  <g fill="rgba(250,246,236,0.4)">
    <circle cx="468" cy="152" r="6"/><circle cx="502" cy="342" r="8"/><circle cx="452" cy="516" r="5"/>
    <circle cx="530" cy="238" r="4"/><circle cx="546" cy="612" r="7"/><circle cx="486" cy="424" r="5"/>
  </g>

  <!-- 基準へ向かう軌跡 -->
  <g fill="none" stroke="rgba(250,246,236,0.16)" stroke-width="1.2">
    <path d="M104 372 C 320 372, 500 380, 690 375"/>
    <path d="M176 600 C 380 592, 540 430, 690 378"/>
    <path d="M196 90 C 400 110, 560 300, 690 372"/>
    <path d="M372 300 C 500 314, 600 350, 690 374"/>
    <path d="M430 452 C 530 440, 620 400, 690 376"/>
  </g>

  <!-- 基準の線（ここは速くならない） -->
  <rect x="686" y="40" width="8" height="670" rx="4" fill="url(#gate)"/>
  <rect x="676" y="330" width="28" height="92" rx="6" fill="rgba(250,246,236,0.5)"/>
  <line x1="660" y1="330" x2="720" y2="330" stroke="rgba(250,246,236,0.35)" stroke-width="1.5"/>
  <line x1="660" y1="422" x2="720" y2="422" stroke="rgba(250,246,236,0.35)" stroke-width="1.5"/>

  <!-- 通過した、ただ一つ -->
  <circle cx="920" cy="376" r="188" fill="url(#chosen)" opacity="0.5"/>
  <circle cx="920" cy="376" r="66" fill="#8CC4D0" opacity="0.9"/>
  <circle cx="920" cy="376" r="118" fill="none" stroke="rgba(250,246,236,0.35)" stroke-width="2"/>
  <circle cx="920" cy="376" r="164" fill="none" stroke="rgba(250,246,236,0.16)" stroke-width="1.2"/>
  <line x1="704" y1="376" x2="854" y2="376" stroke="rgba(250,246,236,0.5)" stroke-width="2.5"/>

  <!-- 通らなかったものの余韻 -->
  <g fill="none" stroke="rgba(155,140,200,0.28)" stroke-width="1.2">
    <path d="M600 200 C 660 250, 664 300, 640 330"/>
    <path d="M604 570 C 664 512, 668 462, 644 424"/>
  </g>
  <circle cx="1140" cy="112" r="6" fill="rgba(250,246,236,0.24)"/>
  <circle cx="1096" cy="672" r="9" fill="rgba(123,186,212,0.3)"/>
</svg>
