<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 別々の色を持つ5本の帯が、共通のリズム（波形）を通わされ、右側でひとつの束に収束する（異なるサービスをひとつの記憶に束ねる統合設計） -->
  <defs>
    <linearGradient id="bg2" gradientTransform="rotate(150)">
      <stop offset="0%" stop-color="#2A2E52"/>
      <stop offset="60%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#151A33"/>
    </linearGradient>
    <linearGradient id="merge2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FAF6EC" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FAF6EC" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <!-- 左でばらけ、右で同じ高さ・同じリズムへ収束する5本の帯（色は各サービス＝個性） -->
  <g fill="none" stroke-width="9" stroke-linecap="round">
    <path d="M40 170 C 260 150, 320 210, 470 300 C 640 400, 760 372, 980 375" stroke="#9B8CC8" opacity="0.9"/>
    <path d="M40 300 C 260 290, 330 300, 480 330 C 660 366, 780 372, 980 375" stroke="#7BBAD4" opacity="0.9"/>
    <path d="M40 400 C 260 410, 330 400, 490 388 C 660 375, 790 375, 980 375" stroke="#C8A4C4" opacity="0.9"/>
    <path d="M40 500 C 260 520, 340 470, 500 430 C 670 388, 800 378, 980 375" stroke="#8CC4D0" opacity="0.9"/>
    <path d="M40 620 C 260 640, 350 520, 520 455 C 690 392, 810 378, 980 375" stroke="#3D5070" opacity="0.95"/>
  </g>
  <!-- 収束後、ひとつのリズム（共通の型）を刻む統合波形 -->
  <path d="M980 375 C 1010 330, 1035 420, 1065 375 C 1095 330, 1120 420, 1150 375"
        fill="none" stroke="url(#merge2)" stroke-width="10" stroke-linecap="round"/>
  <!-- 収束点＝ひとつの記憶 -->
  <circle cx="980" cy="375" r="120" fill="none" stroke="rgba(250,246,236,0.14)" stroke-width="1.4"/>
  <circle cx="980" cy="375" r="30" fill="rgba(250,246,236,0.16)"/>
  <circle cx="980" cy="375" r="12" fill="rgba(250,246,236,0.85)"/>
  <!-- リズムを示す拍点（各帯の出発側に等間隔の粒） -->
  <g fill="rgba(250,246,236,0.55)">
    <circle cx="150" cy="185" r="3"/>
    <circle cx="150" cy="305" r="3"/>
    <circle cx="150" cy="402" r="3"/>
    <circle cx="150" cy="505" r="3"/>
    <circle cx="150" cy="622" r="3"/>
  </g>
  <g fill="rgba(250,246,236,0.4)">
    <circle cx="300" cy="120" r="2"/>
    <circle cx="640" cy="640" r="2.2"/>
    <circle cx="1110" cy="200" r="2"/>
    <circle cx="880" cy="600" r="1.8"/>
  </g>
</svg>
