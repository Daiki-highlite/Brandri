<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 薄い実体の上に、何倍もの高さで立ち上がる評価の柱（帳簿価値と倍率） -->
  <defs>
    <linearGradient id="bgC" gradientTransform="rotate(38)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="52%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="colC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7BBAD4" stop-opacity="0.72"/>
      <stop offset="48%" stop-color="#9B8CC8" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="ghostC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8CC4D0" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8CC4D0" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgC)"/>

  <!-- 目盛り: 倍率のものさし -->
  <g stroke="rgba(250,246,236,0.13)" stroke-width="1">
    <line x1="120" y1="620" x2="1080" y2="620"/>
    <line x1="120" y1="470" x2="1080" y2="470"/>
    <line x1="120" y1="320" x2="1080" y2="320"/>
    <line x1="120" y1="170" x2="1080" y2="170"/>
  </g>

  <!-- 帳簿上の実体（薄い一層） -->
  <g>
    <rect x="196" y="620" width="180" height="52" rx="4" fill="rgba(250,246,236,0.20)"/>
    <rect x="196" y="606" width="180" height="14" rx="3" fill="rgba(250,246,236,0.34)"/>
  </g>

  <!-- かつての評価（低い柱） -->
  <rect x="440" y="470" width="180" height="202" rx="5" fill="url(#ghostC)"/>
  <rect x="440" y="470" width="180" height="202" rx="5" fill="none" stroke="rgba(250,246,236,0.20)" stroke-width="1.2" stroke-dasharray="5 8"/>

  <!-- いまの評価（三倍を超えて立つ柱） -->
  <rect x="684" y="122" width="180" height="550" rx="6" fill="url(#colC)"/>
  <rect x="684" y="122" width="180" height="550" rx="6" fill="none" stroke="rgba(250,246,236,0.42)" stroke-width="1.6"/>
  <g stroke="rgba(250,246,236,0.22)" stroke-width="1">
    <line x1="684" y1="272" x2="864" y2="272"/>
    <line x1="684" y1="422" x2="864" y2="422"/>
    <line x1="684" y1="572" x2="864" y2="572"/>
  </g>

  <!-- 追いついた水準 -->
  <rect x="928" y="140" width="130" height="532" rx="5" fill="rgba(200,164,196,0.18)"/>
  <rect x="928" y="140" width="130" height="532" rx="5" fill="none" stroke="rgba(200,164,196,0.34)" stroke-width="1.2" stroke-dasharray="4 9"/>
  <line x1="620" y1="140" x2="1080" y2="140" stroke="rgba(200,164,196,0.55)" stroke-width="2"/>
  <circle cx="1058" cy="140" r="8" fill="rgba(200,164,196,0.85)"/>

  <!-- 上へ抜ける差分 -->
  <path d="M774 96 L 800 138 L 748 138 Z" fill="rgba(250,246,236,0.62)"/>
  <line x1="774" y1="122" x2="774" y2="672" stroke="rgba(250,246,236,0.16)" stroke-width="1"/>

  <!-- 積み上がった年月 -->
  <g fill="none" stroke="rgba(123,186,212,0.26)" stroke-width="1.2">
    <circle cx="176" cy="196" r="88"/>
    <circle cx="176" cy="196" r="52"/>
  </g>
  <circle cx="176" cy="196" r="6" fill="rgba(250,246,236,0.55)"/>
  <line x1="120" y1="672" x2="1080" y2="672" stroke="rgba(250,246,236,0.42)" stroke-width="2"/>
</svg>
