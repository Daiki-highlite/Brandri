<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(160)">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="58%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#9B8CC8"/>
    </linearGradient>
    <g id="ripple">
      <circle r="26" fill="rgba(250,246,236,0.30)"/>
      <circle r="52" fill="none" stroke="#8CC4D0" stroke-width="3" opacity="0.75"/>
      <circle r="86" fill="none" stroke="#7BBAD4" stroke-width="2.4" opacity="0.5"/>
      <circle r="124" fill="none" stroke="rgba(250,246,236,0.42)" stroke-width="1.8"/>
      <circle r="166" fill="none" stroke="rgba(250,246,236,0.22)" stroke-width="1.4"/>
    </g>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <g opacity="0.16">
    <path d="M0 210 H1200" stroke="rgba(250,246,236,0.9)" stroke-width="1"/>
    <path d="M0 540 H1200" stroke="rgba(250,246,236,0.9)" stroke-width="1"/>
  </g>

  <rect x="0" y="210" width="1200" height="330" fill="rgba(30,35,64,0.22)"/>

  <g clip-path="none">
    <use href="#ripple" x="215" y="375" opacity="0.55"/>
    <use href="#ripple" x="440" y="375" opacity="0.8"/>
    <use href="#ripple" x="665" y="375" opacity="0.8"/>
    <use href="#ripple" x="890" y="375" opacity="0.55"/>
  </g>

  <g opacity="0.9">
    <circle cx="1108" cy="375" r="26" fill="#C8A4C4" opacity="0.45"/>
    <circle cx="1108" cy="375" r="52" fill="none" stroke="#C8A4C4" stroke-width="2.6" opacity="0.35"/>
  </g>

  <g fill="rgba(250,246,236,0.5)">
    <rect x="215" y="612" width="4" height="26"/>
    <rect x="440" y="612" width="4" height="26"/>
    <rect x="665" y="612" width="4" height="26"/>
    <rect x="890" y="612" width="4" height="26"/>
  </g>
  <rect x="215" y="636" width="679" height="2" fill="rgba(250,246,236,0.28)"/>

  <g opacity="0.28">
    <circle cx="150" cy="120" r="4" fill="rgba(250,246,236,0.9)"/>
    <circle cx="1040" cy="640" r="4" fill="#8CC4D0"/>
  </g>
</svg>
