<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 眠って積層した資産(IP)の一つに判断軸が通り、光を取り戻す（リブランドで潜在能力を引き出す） -->
  <defs>
    <linearGradient id="bg1" gradientTransform="rotate(28)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="58%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7BBAD4" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#9B8CC8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg1)"/>
  <!-- 眠っている資産の束（くすんだ層） -->
  <g transform="rotate(-6 520 430)">
    <rect x="180" y="360" width="440" height="150" rx="10" fill="rgba(250,246,236,0.05)"/>
    <rect x="210" y="300" width="440" height="150" rx="10" fill="rgba(250,246,236,0.08)"/>
    <rect x="240" y="240" width="440" height="150" rx="10" fill="rgba(250,246,236,0.11)"/>
    <rect x="270" y="180" width="440" height="150" rx="10" fill="rgba(155,140,200,0.14)"/>
  </g>
  <!-- 引き出された一枚（判断軸が通り、光を取り戻す） -->
  <g transform="rotate(8 800 330)">
    <ellipse cx="800" cy="330" rx="300" ry="210" fill="url(#glow1)"/>
    <rect x="600" y="205" width="420" height="250" rx="12" fill="rgba(123,186,212,0.55)"/>
    <rect x="600" y="205" width="420" height="250" rx="12" fill="none" stroke="rgba(250,246,236,0.7)" stroke-width="2"/>
    <!-- 判断軸 -->
    <line x1="610" y1="330" x2="1010" y2="330" stroke="rgba(250,246,236,0.85)" stroke-width="3"/>
    <circle cx="810" cy="330" r="14" fill="#FAF6EC"/>
    <circle cx="810" cy="330" r="30" fill="none" stroke="rgba(250,246,236,0.6)" stroke-width="1.6"/>
    <circle cx="810" cy="330" r="52" fill="none" stroke="rgba(250,246,236,0.3)" stroke-width="1"/>
  </g>
  <!-- 再起動の同心波 -->
  <g fill="none" stroke="rgba(200,164,196,0.4)">
    <circle cx="1030" cy="600" r="70" stroke-width="1.4"/>
    <circle cx="1030" cy="600" r="118" stroke-width="1" opacity="0.6"/>
  </g>
  <g fill="rgba(250,246,236,0.6)">
    <circle cx="150" cy="150" r="2.4"/>
    <circle cx="1090" cy="120" r="2"/>
    <circle cx="120" cy="600" r="2.2"/>
  </g>
</svg>
