<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 一つの中心から放たれる指揮の弧が、散らばるノードを一つの方向へ束ねる（戦略の指揮者／オーケストレーター） -->
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(32)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="55%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B8CC8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <!-- 指揮の中心 -->
  <g>
    <circle cx="330" cy="375" r="150" fill="url(#core)"/>
    <circle cx="330" cy="375" r="16" fill="rgba(250,246,236,0.92)"/>
    <circle cx="330" cy="375" r="34" fill="none" stroke="rgba(155,140,200,0.6)" stroke-width="1.5"/>
  </g>
  <!-- 指揮の弧（同じ中心から広がる同心の掃引） -->
  <g fill="none" stroke-linecap="round">
    <path d="M 470 250 A 320 320 0 0 1 470 500" stroke="rgba(140,196,208,0.55)" stroke-width="3"/>
    <path d="M 560 200 A 430 430 0 0 1 560 550" stroke="rgba(123,186,212,0.4)" stroke-width="2.5"/>
    <path d="M 660 160 A 560 560 0 0 1 660 590" stroke="rgba(200,164,196,0.3)" stroke-width="2"/>
    <path d="M 770 130 A 700 700 0 0 1 770 620" stroke="rgba(250,246,236,0.18)" stroke-width="1.5"/>
  </g>
  <!-- 束ねられるノード（同じ方向へ整列） -->
  <g>
    <line x1="330" y1="375" x2="620" y2="235" stroke="rgba(250,246,236,0.22)" stroke-width="1.2"/>
    <line x1="330" y1="375" x2="700" y2="330" stroke="rgba(250,246,236,0.22)" stroke-width="1.2"/>
    <line x1="330" y1="375" x2="740" y2="420" stroke="rgba(250,246,236,0.22)" stroke-width="1.2"/>
    <line x1="330" y1="375" x2="640" y2="510" stroke="rgba(250,246,236,0.22)" stroke-width="1.2"/>
    <circle cx="620" cy="235" r="9" fill="#8CC4D0"/>
    <circle cx="700" cy="330" r="7" fill="rgba(250,246,236,0.85)"/>
    <circle cx="740" cy="420" r="10" fill="#7BBAD4"/>
    <circle cx="640" cy="510" r="7" fill="#C8A4C4"/>
    <circle cx="890" cy="290" r="6" fill="rgba(250,246,236,0.7)"/>
    <circle cx="940" cy="470" r="8" fill="rgba(140,196,208,0.75)"/>
  </g>
  <!-- 周辺の点 -->
  <circle cx="1080" cy="180" r="4" fill="rgba(250,246,236,0.5)"/>
  <circle cx="180" cy="600" r="5" fill="rgba(155,140,200,0.6)"/>
  <circle cx="200" cy="160" r="3.5" fill="rgba(250,246,236,0.45)"/>
</svg>
