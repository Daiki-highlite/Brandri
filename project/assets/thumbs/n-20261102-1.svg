<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="g" gradientTransform="rotate(150)">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="60%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#9B8CC8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C8A4C4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#g)"/>
  <!-- 広がり続ける可能性の波 -->
  <circle cx="360" cy="400" r="300" fill="url(#glow)"/>
  <g fill="none" stroke="rgba(250,246,236,0.22)">
    <circle cx="360" cy="400" r="120" stroke-width="2"/>
    <circle cx="360" cy="400" r="190" stroke-width="1.5"/>
    <circle cx="360" cy="400" r="260" stroke-width="1"/>
    <circle cx="360" cy="400" r="330" stroke-width="0.8" stroke="rgba(250,246,236,0.12)"/>
  </g>
  <!-- 重なる三角（デザイン） -->
  <polygon points="360,290 460,470 260,470" fill="#9B8CC8" opacity="0.55"/>
  <polygon points="330,330 430,500 230,500" fill="#7BBAD4" opacity="0.4"/>
  <polygon points="395,340 485,505 305,505" fill="#C8A4C4" opacity="0.35"/>
  <!-- 遠くに立つ一本の柱（経営の判断） -->
  <rect x="930" y="250" width="54" height="300" fill="rgba(250,246,236,0.16)"/>
  <rect x="930" y="240" width="54" height="6" fill="rgba(250,246,236,0.6)"/>
  <rect x="1010" y="330" width="36" height="220" fill="#1E2340" opacity="0.8"/>
  <rect x="1010" y="322" width="36" height="5" fill="rgba(250,246,236,0.45)"/>
  <line x1="880" y1="552" x2="1090" y2="552" stroke="rgba(250,246,236,0.35)" stroke-width="2"/>
  <!-- 波から柱へ渡す一本の細い線（翻訳） -->
  <path d="M 470 400 C 640 400, 760 300, 928 300" fill="none" stroke="#8CC4D0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="928" cy="300" r="7" fill="#8CC4D0"/>
  <circle cx="470" cy="400" r="5" fill="rgba(250,246,236,0.8)"/>
  <!-- 粒子 -->
  <g fill="rgba(250,246,236,0.35)">
    <circle cx="120" cy="110" r="2"/><circle cx="640" cy="140" r="1.5"/><circle cx="760" cy="620" r="2.2"/>
    <circle cx="1120" cy="160" r="1.6"/><circle cx="560" cy="660" r="1.2"/><circle cx="820" cy="210" r="1.8"/>
  </g>
</svg>
