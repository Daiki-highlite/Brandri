<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 「言うこと」と「やること」の二つの波が、中央で位相を揃える（見抜く世代に効く判断の一貫性） -->
  <defs>
    <linearGradient id="bg3" gradientTransform="rotate(58)">
      <stop offset="0%" stop-color="#3D5070"/>
      <stop offset="55%" stop-color="#6F5FA0"/>
      <stop offset="100%" stop-color="#9B8CC8"/>
    </linearGradient>
    <radialGradient id="lock3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF6EC" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#C8A4C4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg3)"/>
  <!-- 「言うこと」の波（左でずれ、中央で揃う） -->
  <g fill="none" stroke="rgba(123,186,212,0.75)" stroke-width="3">
    <path d="M0 300 C 150 200, 300 400, 450 300 C 560 230, 640 230, 750 375 C 860 520, 940 520, 1050 375 C 1160 250, 1200 375, 1200 375"/>
    <path d="M0 340 C 150 240, 300 440, 450 340 C 560 275, 640 275, 750 375 C 860 480, 940 480, 1050 375 C 1160 290, 1200 375, 1200 375" opacity="0.5"/>
  </g>
  <!-- 「やること」の波（左で逆位相、中央で一致） -->
  <g fill="none" stroke="rgba(200,164,196,0.8)" stroke-width="3">
    <path d="M0 470 C 150 570, 300 370, 450 470 C 560 545, 640 500, 750 375 C 860 250, 940 250, 1050 375 C 1160 490, 1200 375, 1200 375"/>
    <path d="M0 430 C 150 530, 300 330, 450 430 C 560 500, 640 460, 750 375 C 860 290, 940 290, 1050 375 C 1160 455, 1200 375, 1200 375" opacity="0.5"/>
  </g>
  <!-- 位相が揃う結節点 -->
  <ellipse cx="820" cy="375" rx="230" ry="170" fill="url(#lock3)"/>
  <circle cx="750" cy="375" r="12" fill="#FAF6EC"/>
  <circle cx="1050" cy="375" r="12" fill="#FAF6EC"/>
  <circle cx="900" cy="375" r="16" fill="#1E2340"/>
  <circle cx="900" cy="375" r="34" fill="none" stroke="rgba(250,246,236,0.7)" stroke-width="1.8"/>
  <circle cx="900" cy="375" r="62" fill="none" stroke="rgba(250,246,236,0.35)" stroke-width="1"/>
  <!-- 左側のずれを示す縦のガイド -->
  <g stroke="rgba(250,246,236,0.25)" stroke-width="1" stroke-dasharray="3 7">
    <line x1="230" y1="180" x2="230" y2="590"/>
    <line x1="450" y1="200" x2="450" y2="560"/>
  </g>
  <g fill="rgba(250,246,236,0.55)">
    <circle cx="120" cy="150" r="2.2"/>
    <circle cx="1080" cy="620" r="2.4"/>
    <circle cx="640" cy="120" r="1.8"/>
  </g>
</svg>
