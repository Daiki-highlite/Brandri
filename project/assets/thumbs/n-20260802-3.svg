<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 個々の投稿が共通の基準（貫く軸）に沿って積層し、一つの厚みになる（接客の蓄積） -->
  <defs>
    <linearGradient id="k3bg" gradientTransform="rotate(-14)">
      <stop offset="0%" stop-color="#3D5070"/>
      <stop offset="42%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#151A33"/>
    </linearGradient>
    <linearGradient id="k3axis" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8CC4D0" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#8CC4D0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7BBAD4" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="k3glow" cx="30%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#8CC4D0" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#8CC4D0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#k3bg)"/>
  <rect width="1200" height="750" fill="url(#k3glow)"/>
  <g transform="rotate(-4 600 400)">
    <rect x="303.6" y="650" width="300" height="30" rx="6" fill="rgba(250,246,236,0.1)"/>
    <circle cx="329.6" cy="665" r="6" fill="#8CC4D0" fill-opacity="0.55"/>
    <rect x="525.6" y="662" width="52" height="6" rx="3" fill="#8CC4D0" fill-opacity="0.42"/>
    <rect x="291.68" y="588" width="337.5" height="32.25" rx="6" fill="rgba(250,246,236,0.14)"/>
    <circle cx="317.68" cy="604.13" r="6.5" fill="#7BBAD4" fill-opacity="0.6"/>
    <rect x="265.71" y="526" width="375" height="34.5" rx="6" fill="rgba(250,246,236,0.18)"/>
    <circle cx="291.71" cy="543.25" r="7" fill="#9B8CC8" fill-opacity="0.65"/>
    <rect x="562.71" y="540.25" width="52" height="6" rx="3" fill="#9B8CC8" fill-opacity="0.42"/>
    <rect x="264.64" y="464" width="412.5" height="36.75" rx="6" fill="rgba(250,246,236,0.21)"/>
    <circle cx="290.64" cy="482.38" r="7.5" fill="#C8A4C4" fill-opacity="0.7"/>
    <rect x="259.24" y="402" width="450" height="39" rx="6" fill="rgba(250,246,236,0.25)"/>
    <circle cx="285.24" cy="421.5" r="8" fill="#8CC4D0" fill-opacity="0.75"/>
    <rect x="631.24" y="418.5" width="52" height="6" rx="3" fill="#8CC4D0" fill-opacity="0.42"/>
    <rect x="252" y="340" width="487.5" height="41.25" rx="6" fill="rgba(250,246,236,0.29)"/>
    <circle cx="278" cy="360.63" r="8.5" fill="#7BBAD4" fill-opacity="0.8"/>
    <rect x="234.8" y="278" width="525" height="43.5" rx="6" fill="rgba(250,246,236,0.32)"/>
    <circle cx="260.8" cy="299.75" r="9" fill="#9B8CC8" fill-opacity="0.85"/>
    <rect x="681.8" y="296.75" width="52" height="6" rx="3" fill="#9B8CC8" fill-opacity="0.42"/>
    <rect x="215.75" y="216" width="562.5" height="45.75" rx="6" fill="rgba(250,246,236,0.36)"/>
    <circle cx="241.75" cy="238.88" r="9.5" fill="#C8A4C4" fill-opacity="0.9"/>
    <rect x="207.31" y="154" width="600" height="48" rx="6" fill="rgba(250,246,236,0.4)"/>
    <circle cx="233.31" cy="178" r="10" fill="#8CC4D0" fill-opacity="0.95"/>
    <rect x="729.31" y="175" width="52" height="6" rx="3" fill="#8CC4D0" fill-opacity="0.42"/>
  </g>
  <!-- 全層を貫く共通の基準 -->
  <line x1="326" y1="700" x2="238" y2="52" stroke="url(#k3axis)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="238" cy="52" r="9" fill="#8CC4D0" fill-opacity="0.9"/>
  <!-- 届いた先に広がる波 -->
  <g fill="none" stroke="#7BBAD4">
    <circle cx="930" cy="196" r="58" stroke-opacity="0.42" stroke-width="2"/>
    <circle cx="930" cy="196" r="106" stroke-opacity="0.26" stroke-width="1.5"/>
    <circle cx="930" cy="196" r="164" stroke-opacity="0.14" stroke-width="1"/>
  </g>
  <circle cx="930" cy="196" r="18" fill="rgba(250,246,236,0.40)"/>
</svg>
