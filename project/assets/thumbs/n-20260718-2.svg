<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 均質に量産された格子の反復と、一つだけ温度を帯びて逸脱する「共感」 -->
  <defs>
    <linearGradient id="bg2" gradientTransform="rotate(200)">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="60%" stop-color="#1A1F3A"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <radialGradient id="warm2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A4C4" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#9B8CC8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>

  <!-- 量産: 均質に並ぶ同一ユニットの格子 -->
  <g fill="none" stroke="rgba(140,196,208,0.4)" stroke-width="2">
    <!-- 6列 x 4行、規則的に反復 -->
    <rect x="150" y="150" width="80" height="80" rx="6"/>
    <rect x="290" y="150" width="80" height="80" rx="6"/>
    <rect x="430" y="150" width="80" height="80" rx="6"/>
    <rect x="690" y="150" width="80" height="80" rx="6"/>
    <rect x="830" y="150" width="80" height="80" rx="6"/>
    <rect x="970" y="150" width="80" height="80" rx="6"/>

    <rect x="150" y="290" width="80" height="80" rx="6"/>
    <rect x="290" y="290" width="80" height="80" rx="6"/>
    <rect x="430" y="290" width="80" height="80" rx="6"/>
    <rect x="690" y="290" width="80" height="80" rx="6"/>
    <rect x="830" y="290" width="80" height="80" rx="6"/>
    <rect x="970" y="290" width="80" height="80" rx="6"/>

    <rect x="150" y="430" width="80" height="80" rx="6"/>
    <rect x="290" y="430" width="80" height="80" rx="6"/>
    <rect x="430" y="430" width="80" height="80" rx="6"/>
    <rect x="690" y="430" width="80" height="80" rx="6"/>
    <rect x="830" y="430" width="80" height="80" rx="6"/>
    <rect x="970" y="430" width="80" height="80" rx="6"/>

    <rect x="150" y="570" width="80" height="80" rx="6"/>
    <rect x="290" y="570" width="80" height="80" rx="6"/>
    <rect x="430" y="570" width="80" height="80" rx="6"/>
    <rect x="690" y="570" width="80" height="80" rx="6"/>
    <rect x="830" y="570" width="80" height="80" rx="6"/>
    <rect x="970" y="570" width="80" height="80" rx="6"/>
  </g>

  <!-- 共感: 格子の空席に、温度を帯びて逸脱する一つ -->
  <circle cx="600" cy="330" r="150" fill="url(#warm2)"/>
  <circle cx="600" cy="330" r="62" fill="#C8A4C4" fill-opacity="0.9"/>
  <circle cx="600" cy="330" r="62" fill="none" stroke="rgba(250,246,236,0.65)" stroke-width="2"/>
  <!-- 逸脱がまわりへ広がる波 -->
  <circle cx="600" cy="330" r="96" fill="none" stroke="rgba(200,164,196,0.35)" stroke-width="1.5"/>
  <circle cx="600" cy="330" r="124" fill="none" stroke="rgba(200,164,196,0.2)" stroke-width="1.5"/>
</svg>
