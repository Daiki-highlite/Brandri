<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="70%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#9B8CC8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(250,246,236,0.22)"/>
      <stop offset="100%" stop-color="rgba(250,246,236,0)"/>
    </radialGradient>
    <linearGradient id="big" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8CC4D0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#g)"/>
  <circle cx="960" cy="150" r="220" fill="url(#glow)"/>
  <circle cx="960" cy="150" r="46" fill="rgba(250,246,236,0.18)"/>
  <!-- same form, scaled 1.5x -->
  <rect x="250" y="360" width="200" height="200" rx="100" fill="#7BBAD4" opacity="0.45"/>
  <rect x="530" y="260" width="300" height="300" rx="150" fill="url(#big)"/>
  <rect x="530" y="260" width="300" height="300" rx="150" fill="none" stroke="rgba(250,246,236,0.5)" stroke-width="2"/>
  <rect x="250" y="360" width="200" height="200" rx="100" fill="none" stroke="rgba(250,246,236,0.35)" stroke-width="2" stroke-dasharray="6 8"/>
  <!-- scaling guides -->
  <line x1="350" y1="360" x2="680" y2="260" stroke="rgba(250,246,236,0.22)" stroke-width="1.5"/>
  <line x1="350" y1="560" x2="680" y2="560" stroke="rgba(250,246,236,0.22)" stroke-width="1.5"/>
  <line x1="120" y1="600" x2="1080" y2="600" stroke="rgba(250,246,236,0.3)" stroke-width="2"/>
  <g fill="rgba(250,246,236,0.45)">
    <circle cx="180" cy="120" r="2.2"/><circle cx="420" cy="90" r="1.6"/><circle cx="620" cy="160" r="2"/>
    <circle cx="760" cy="80" r="1.4"/><circle cx="1110" cy="330" r="1.8"/><circle cx="90" cy="300" r="1.5"/>
    <circle cx="1020" cy="470" r="2.1"/><circle cx="300" cy="220" r="1.3"/>
  </g>
