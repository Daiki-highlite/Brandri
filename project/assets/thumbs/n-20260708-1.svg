<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 散らばった施策（点）が回転しながら一つの核（コト＝顧客に起きる出来事）へ束ねられる -->
  <defs>
    <linearGradient id="bg1" gradientTransform="rotate(65)">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="55%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#9B8CC8"/>
    </linearGradient>
    <radialGradient id="core1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF6EC" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#C8A4C4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg1)"/>
  <!-- 回転する軌道（ターン） -->
  <g fill="none" stroke="rgba(250,246,236,0.22)" stroke-width="1.6">
    <ellipse cx="600" cy="375" rx="430" ry="150" transform="rotate(-18 600 375)"/>
    <ellipse cx="600" cy="375" rx="330" ry="300" transform="rotate(28 600 375)"/>
    <ellipse cx="600" cy="375" rx="230" ry="230"/>
  </g>
  <!-- 束ねられていく点（散らばった接点が核へ向かう） -->
  <g stroke="rgba(139,196,208,0.5)" stroke-width="1.2" fill="none">
    <path d="M170 250 Q 420 320 590 372"/>
    <path d="M1040 210 Q 780 300 610 366"/>
    <path d="M250 560 Q 460 470 588 386"/>
    <path d="M980 570 Q 760 470 612 388"/>
    <path d="M600 120 Q 600 250 600 360"/>
  </g>
  <g fill="rgba(250,246,236,0.62)">
    <circle cx="170" cy="250" r="7"/>
    <circle cx="1040" cy="210" r="8"/>
    <circle cx="250" cy="560" r="6.5"/>
    <circle cx="980" cy="570" r="7.5"/>
    <circle cx="600" cy="120" r="6"/>
  </g>
  <g fill="rgba(123,186,212,0.55)">
    <circle cx="360" cy="300" r="3.4"/>
    <circle cx="860" cy="270" r="3"/>
    <circle cx="420" cy="500" r="3.2"/>
    <circle cx="820" cy="500" r="2.8"/>
    <circle cx="600" cy="210" r="3"/>
  </g>
  <!-- 収束した核（コト） -->
  <circle cx="600" cy="375" r="220" fill="url(#core1)"/>
  <circle cx="600" cy="375" r="66" fill="rgba(250,246,236,0.9)"/>
  <circle cx="600" cy="375" r="98" fill="none" stroke="rgba(250,246,236,0.6)" stroke-width="2"/>
  <!-- 舞う粒子 -->
  <g fill="rgba(200,164,196,0.7)">
    <circle cx="300" cy="150" r="2.6"/>
    <circle cx="930" cy="150" r="3"/>
    <circle cx="1070" cy="420" r="2.2"/>
    <circle cx="140" cy="430" r="2.4"/>
    <circle cx="600" cy="650" r="2.6"/>
  </g>
</svg>
