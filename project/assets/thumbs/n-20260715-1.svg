<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 旧→新へ順序だてた「切り替えの道」。節目（実施日）のリングを辿るほど色が暗→明へ移る（リブランドの移行設計）。右上の同心円は「ゼロ＝NOLL」への軽やかな乗り出し -->
  <defs>
    <linearGradient id="bg1" gradientTransform="rotate(28)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="55%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="road1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D5070" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7BBAD4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8CC4D0" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="zero1">
      <stop offset="0%" stop-color="#FAF6EC" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FAF6EC" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FAF6EC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg1)"/>
  <!-- 順序だてた移行の道（旧い暗色から新しい明色へ） -->
  <path d="M90 600 C 340 610, 430 430, 640 400 C 860 368, 940 220, 1140 190"
        fill="none" stroke="url(#road1)" stroke-width="26" stroke-linecap="round"/>
  <path d="M90 600 C 340 610, 430 430, 640 400 C 860 368, 940 220, 1140 190"
        fill="none" stroke="rgba(250,246,236,0.5)" stroke-width="2" stroke-dasharray="2 20" stroke-linecap="round"/>
  <!-- 節目（実施日）のリング。左＝旧、右へ進むほど新へ -->
  <g fill="none">
    <circle cx="150" cy="602" r="34" stroke="rgba(155,140,200,0.65)" stroke-width="4"/>
    <circle cx="150" cy="602" r="14" fill="rgba(155,140,200,0.55)"/>
    <circle cx="470" cy="470" r="40" stroke="rgba(123,186,212,0.7)" stroke-width="4"/>
    <circle cx="470" cy="470" r="16" fill="rgba(123,186,212,0.6)"/>
    <circle cx="830" cy="360" r="46" stroke="rgba(140,196,208,0.8)" stroke-width="5"/>
    <circle cx="830" cy="360" r="18" fill="rgba(140,196,208,0.7)"/>
  </g>
  <!-- 到達点＝新ブランドの節目（大きく明るく） -->
  <circle cx="1070" cy="230" r="64" fill="none" stroke="rgba(250,246,236,0.75)" stroke-width="5"/>
  <circle cx="1070" cy="230" r="26" fill="rgba(200,164,196,0.85)"/>
  <!-- 右上「ゼロ」への乗り出しを示す同心円 -->
  <circle cx="1070" cy="230" r="150" fill="url(#zero1)"/>
  <g fill="none" stroke="rgba(250,246,236,0.3)">
    <circle cx="1070" cy="230" r="112" stroke-width="1.2" stroke-dasharray="1 8" stroke-linecap="round"/>
    <circle cx="1070" cy="230" r="176" stroke-width="0.8" opacity="0.5"/>
  </g>
  <!-- 前進を示す粒子 -->
  <g fill="rgba(250,246,236,0.6)">
    <circle cx="300" cy="540" r="2.4"/>
    <circle cx="600" cy="430" r="2"/>
    <circle cx="720" cy="300" r="1.8"/>
    <circle cx="240" cy="360" r="2"/>
    <circle cx="960" cy="470" r="2.2"/>
  </g>
</svg>
