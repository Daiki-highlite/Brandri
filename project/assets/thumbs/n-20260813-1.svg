<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="60%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#1E2340"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7BBAD4" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7BBAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C8A4C4" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="750"/></clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <circle cx="410" cy="392" r="430" fill="url(#glowA)"/>
    <circle cx="808" cy="342" r="400" fill="url(#glowB)"/>

    <!-- 中心A：自社が設計している範囲 -->
    <g fill="none" stroke="#8CC4D0" stroke-opacity="0.55">
      <circle cx="410" cy="392" r="96" stroke-width="2.2"/>
      <circle cx="410" cy="392" r="168" stroke-width="1.8" stroke-opacity="0.44"/>
      <circle cx="410" cy="392" r="246" stroke-width="1.5" stroke-opacity="0.32"/>
      <circle cx="410" cy="392" r="330" stroke-width="1.2" stroke-opacity="0.2"/>
      <circle cx="410" cy="392" r="420" stroke-width="1" stroke-opacity="0.12"/>
    </g>

    <!-- 中心B：協業によって届く範囲 -->
    <g fill="none" stroke="#C8A4C4" stroke-opacity="0.5">
      <circle cx="808" cy="342" r="78" stroke-width="2.2"/>
      <circle cx="808" cy="342" r="146" stroke-width="1.8" stroke-opacity="0.4"/>
      <circle cx="808" cy="342" r="228" stroke-width="1.5" stroke-opacity="0.28"/>
      <circle cx="808" cy="342" r="318" stroke-width="1.2" stroke-opacity="0.18"/>
      <circle cx="808" cy="342" r="412" stroke-width="1" stroke-opacity="0.1"/>
    </g>

    <!-- 重なりの帯：譲れない一点が共有される領域 -->
    <path d="M609 108 C 668 196 668 538 609 626 C 550 538 550 196 609 108 Z"
          fill="rgba(250,246,236,0.10)" stroke="rgba(250,246,236,0.30)" stroke-width="1.6"/>

    <!-- 二つの中心をつなぐ線と、その上のノード -->
    <line x1="410" y1="392" x2="808" y2="342" stroke="#9B8CC8" stroke-width="1.6" stroke-opacity="0.6"/>
    <g stroke="#9B8CC8" stroke-width="1.1" stroke-opacity="0.34">
      <line x1="410" y1="392" x2="609" y2="150"/>
      <line x1="410" y1="392" x2="609" y2="584"/>
      <line x1="808" y1="342" x2="609" y2="150"/>
      <line x1="808" y1="342" x2="609" y2="584"/>
      <line x1="609" y1="150" x2="609" y2="584"/>
    </g>

    <g fill="rgba(250,246,236,0.88)">
      <circle cx="410" cy="392" r="9"/>
      <circle cx="808" cy="342" r="7.5"/>
    </g>
    <g fill="#8CC4D0" fill-opacity="0.9">
      <circle cx="609" cy="150" r="5"/>
      <circle cx="609" cy="584" r="5"/>
      <circle cx="609" cy="367" r="6.5" fill="#C8A4C4"/>
    </g>

    <!-- 外へ広がる小さな到達点 -->
    <g fill="#7BBAD4" fill-opacity="0.5">
      <circle cx="168" cy="228" r="3.5"/>
      <circle cx="212" cy="566" r="3"/>
      <circle cx="96" cy="418" r="2.5"/>
      <circle cx="1046" cy="196" r="3.5"/>
      <circle cx="1104" cy="474" r="3"/>
      <circle cx="944" cy="628" r="2.5"/>
      <circle cx="742" cy="672" r="3"/>
      <circle cx="352" cy="88" r="2.5"/>
    </g>

    <!-- 紙色の水平線：判断の基準面 -->
    <g stroke="rgba(250,246,236,0.16)" stroke-width="1">
      <line x1="0" y1="672" x2="1200" y2="672"/>
      <line x1="0" y1="700" x2="1200" y2="700" stroke-opacity="0.5"/>
    </g>
  </g>
</svg>
