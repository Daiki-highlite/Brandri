<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 散らばった断片（AIが切り出す引用）が、一本の対角線＝一貫した軸に沿って同じ人格を宿す -->
  <defs>
    <linearGradient id="bg3" gradientTransform="rotate(150)">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="55%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#2A3358"/>
    </linearGradient>
    <linearGradient id="shard3" gradientTransform="rotate(40)">
      <stop offset="0%" stop-color="#7BBAD4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8CC4D0" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg3)"/>
  <!-- 一貫の軸（どの断片も同じ基準を通る） -->
  <line x1="180" y1="620" x2="1020" y2="130" stroke="rgba(250,246,236,0.5)" stroke-width="3"/>
  <!-- 軸上に整列する断片（同じ人格） -->
  <g stroke="rgba(250,246,236,0.7)" stroke-width="2">
    <rect x="232" y="548" width="86" height="86" rx="6" transform="rotate(-8 275 591)" fill="url(#shard3)"/>
    <rect x="392" y="452" width="96" height="96" rx="6" transform="rotate(6 440 500)" fill="rgba(155,140,200,0.6)"/>
    <rect x="556" y="352" width="104" height="104" rx="6" transform="rotate(-5 608 404)" fill="url(#shard3)"/>
    <rect x="720" y="252" width="96" height="96" rx="6" transform="rotate(9 768 300)" fill="rgba(200,164,196,0.6)"/>
    <rect x="880" y="150" width="86" height="86" rx="6" transform="rotate(-6 923 193)" fill="url(#shard3)"/>
  </g>
  <!-- 軸を外れて薄れる断片（文脈から切り離され、伝わりにくい） -->
  <g fill="rgba(250,246,236,0.14)">
    <rect x="820" y="560" width="70" height="70" rx="5" transform="rotate(18 855 595)"/>
    <rect x="150" y="180" width="60" height="60" rx="5" transform="rotate(-14 180 210)"/>
    <rect x="1030" y="470" width="54" height="54" rx="5" transform="rotate(22 1057 497)"/>
    <rect x="470" y="150" width="48" height="48" rx="5" transform="rotate(-20 494 174)"/>
  </g>
  <!-- ノード網の含み（AIの媒介） -->
  <g fill="rgba(140,196,208,0.55)">
    <circle cx="275" cy="591" r="5"/><circle cx="440" cy="500" r="5"/><circle cx="608" cy="404" r="6"/><circle cx="768" cy="300" r="5"/><circle cx="923" cy="193" r="5"/>
  </g>
</svg>
