<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 体験（中心の円）に遊びの要素が重なり、足し算で広がる（enhance） -->
  <defs>
    <radialGradient id="bg2" cx="42%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#24294A"/>
      <stop offset="70%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#151A33"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <!-- 中心の体験 -->
  <circle cx="560" cy="380" r="180" fill="#3D5070" fill-opacity="0.55"/>
  <circle cx="560" cy="380" r="180" fill="none" stroke="rgba(250,246,236,0.25)" stroke-width="2"/>
  <!-- 重なって足される遊びの要素（乗算的な重なり） -->
  <circle cx="720" cy="300" r="150" fill="#C8A4C4" fill-opacity="0.42"/>
  <circle cx="700" cy="500" r="130" fill="#7BBAD4" fill-opacity="0.42"/>
  <circle cx="420" cy="500" r="120" fill="#8CC4D0" fill-opacity="0.4"/>
  <!-- 足し算の記号（体験に何かが加わる） -->
  <g stroke="rgba(250,246,236,0.75)" stroke-width="12" stroke-linecap="round">
    <line x1="880" y1="200" x2="880" y2="270"/>
    <line x1="845" y1="235" x2="915" y2="235"/>
  </g>
  <g stroke="rgba(250,246,236,0.45)" stroke-width="8" stroke-linecap="round">
    <line x1="300" y1="230" x2="300" y2="280"/>
    <line x1="275" y1="255" x2="325" y2="255"/>
  </g>
  <g stroke="rgba(200,164,196,0.7)" stroke-width="8" stroke-linecap="round">
    <line x1="900" y1="580" x2="900" y2="630"/>
    <line x1="875" y1="605" x2="925" y2="605"/>
  </g>
  <!-- 遊びの軌道 -->
  <circle cx="600" cy="400" r="330" fill="none" stroke="rgba(123,186,212,0.22)" stroke-width="1.5" stroke-dasharray="3 14"/>
  <circle cx="960" cy="150" r="8" fill="rgba(250,246,236,0.55)"/>
  <circle cx="180" cy="600" r="6" fill="rgba(140,196,208,0.5)"/>
</svg>
