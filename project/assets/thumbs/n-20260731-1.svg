<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 二つの中心から広がる波紋が重なり、一つの面になる（内と外／拠点をまたぐ体験の統一） -->
  <defs>
    <linearGradient id="bgA" gradientTransform="rotate(28)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="55%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7BBAD4" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#7BBAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C8A4C4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frameA"><rect x="0" y="0" width="1200" height="750"/></clipPath>
  </defs>
  <rect width="1200" height="750" fill="url(#bgA)"/>
  <g clip-path="url(#frameA)">
    <circle cx="430" cy="375" r="360" fill="url(#glowA)"/>
    <circle cx="790" cy="375" r="340" fill="url(#glowB)"/>

    <!-- 波紋 A: 外から届く体験 -->
    <g fill="none" stroke="#8CC4D0">
      <circle cx="430" cy="375" r="90"  stroke-opacity="0.62" stroke-width="2.4"/>
      <circle cx="430" cy="375" r="150" stroke-opacity="0.50" stroke-width="2"/>
      <circle cx="430" cy="375" r="215" stroke-opacity="0.38" stroke-width="1.8"/>
      <circle cx="430" cy="375" r="285" stroke-opacity="0.26" stroke-width="1.5"/>
      <circle cx="430" cy="375" r="360" stroke-opacity="0.16" stroke-width="1.2"/>
      <circle cx="430" cy="375" r="440" stroke-opacity="0.09" stroke-width="1"/>
    </g>

    <!-- 波紋 B: 内から整える -->
    <g fill="none" stroke="#C8A4C4">
      <circle cx="790" cy="375" r="70"  stroke-opacity="0.58" stroke-width="2.4"/>
      <circle cx="790" cy="375" r="128" stroke-opacity="0.46" stroke-width="2"/>
      <circle cx="790" cy="375" r="192" stroke-opacity="0.34" stroke-width="1.8"/>
      <circle cx="790" cy="375" r="262" stroke-opacity="0.22" stroke-width="1.5"/>
      <circle cx="790" cy="375" r="338" stroke-opacity="0.13" stroke-width="1.2"/>
    </g>

    <!-- 重なりが生む一つの面 -->
    <path d="M610 168 A 300 300 0 0 1 610 582 A 300 300 0 0 1 610 168 Z" fill="rgba(250,246,236,0.10)"/>
    <path d="M610 168 A 300 300 0 0 1 610 582" fill="none" stroke="rgba(250,246,236,0.42)" stroke-width="2"/>
    <path d="M610 582 A 300 300 0 0 1 610 168" fill="none" stroke="rgba(250,246,236,0.42)" stroke-width="2"/>

    <!-- 拠点をまたいで通る一本の基準 -->
    <line x1="0" y1="375" x2="1200" y2="375" stroke="rgba(250,246,236,0.22)" stroke-width="1"/>
    <circle cx="430" cy="375" r="7" fill="rgba(250,246,236,0.85)"/>
    <circle cx="790" cy="375" r="7" fill="rgba(250,246,236,0.85)"/>
    <circle cx="610" cy="375" r="4" fill="#9B8CC8"/>

    <!-- 遠くの拠点 -->
    <circle cx="1090" cy="140" r="46" fill="none" stroke="rgba(250,246,236,0.22)" stroke-width="1.4"/>
    <circle cx="1090" cy="140" r="20" fill="none" stroke="rgba(140,196,208,0.50)" stroke-width="1.4"/>
    <circle cx="128" cy="628" r="62" fill="none" stroke="rgba(250,246,236,0.16)" stroke-width="1.4"/>
    <circle cx="128" cy="628" r="26" fill="none" stroke="rgba(155,140,200,0.45)" stroke-width="1.4"/>
  </g>
</svg>
