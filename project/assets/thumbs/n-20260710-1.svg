<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: ずらりと並ぶ指標の中で、事業を動かす「一本」だけが立ち上がり焦点が当たる（計測・指標の取捨選択） -->
  <defs>
    <linearGradient id="bg1" gradientTransform="rotate(24)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="60%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="focusBar" gradientTransform="rotate(90)">
      <stop offset="0%" stop-color="#8CC4D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7BBAD4" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg1)"/>
  <!-- 測定の目盛り（薄い水平ライン） -->
  <g stroke="rgba(250,246,236,0.10)" stroke-width="1.5">
    <line x1="120" y1="560" x2="1080" y2="560"/>
    <line x1="120" y1="470" x2="1080" y2="470"/>
    <line x1="120" y1="380" x2="1080" y2="380"/>
    <line x1="120" y1="290" x2="1080" y2="290"/>
    <line x1="120" y1="200" x2="1080" y2="200"/>
  </g>
  <!-- 並ぶ多くの指標（くすんだ棒） -->
  <g fill="rgba(155,140,200,0.28)">
    <rect x="170" y="430" width="60" height="180" rx="4"/>
    <rect x="270" y="500" width="60" height="110" rx="4"/>
    <rect x="370" y="400" width="60" height="210" rx="4"/>
    <rect x="670" y="470" width="60" height="140" rx="4"/>
    <rect x="770" y="440" width="60" height="170" rx="4"/>
    <rect x="870" y="510" width="60" height="100" rx="4"/>
    <rect x="970" y="460" width="60" height="150" rx="4"/>
  </g>
  <!-- 事業を動かす「一本」 -->
  <rect x="500" y="150" width="90" height="460" rx="6" fill="url(#focusBar)"/>
  <!-- 焦点のリング（この一本に判断が集まる） -->
  <circle cx="545" cy="150" r="86" fill="none" stroke="rgba(140,196,208,0.9)" stroke-width="3"/>
  <circle cx="545" cy="150" r="120" fill="none" stroke="rgba(250,246,236,0.28)" stroke-width="1.5"/>
  <circle cx="545" cy="150" r="6" fill="rgba(250,246,236,0.9)"/>
  <!-- 基準線 -->
  <line x1="120" y1="610" x2="1080" y2="610" stroke="rgba(250,246,236,0.4)" stroke-width="2.5"/>
</svg>
