<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 多くのきっかけ（周縁の入り口）から一つの想起（中心の光る核）へ呼び戻される -->
  <defs>
    <linearGradient id="bg3" gradientTransform="rotate(115)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="60%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#243A4A"/>
    </linearGradient>
    <radialGradient id="core3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(250,246,236,0.95)"/>
      <stop offset="55%" stop-color="#8CC4D0"/>
      <stop offset="100%" stop-color="#7BBAD4" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg3)"/>
  <!-- きっかけから中心へ向かう線（想起の入り口を増やす） -->
  <g stroke="#8CC4D0" stroke-opacity="0.45" stroke-width="2">
    <line x1="180" y1="140" x2="600" y2="375"/>
    <line x1="120" y1="420" x2="600" y2="375"/>
    <line x1="250" y1="650" x2="600" y2="375"/>
    <line x1="560" y1="680" x2="600" y2="375"/>
    <line x1="980" y1="600" x2="600" y2="375"/>
    <line x1="1080" y1="300" x2="600" y2="375"/>
    <line x1="900" y1="120" x2="600" y2="375"/>
    <line x1="470" y1="90" x2="600" y2="375"/>
  </g>
  <!-- 周縁のきっかけ（入り口）— 濃淡でまだ思い出されないものと結ばれたもの -->
  <g fill="#7BBAD4">
    <circle cx="180" cy="140" r="10" fill-opacity="0.55"/>
    <circle cx="120" cy="420" r="14" fill-opacity="0.8"/>
    <circle cx="250" cy="650" r="9" fill-opacity="0.45"/>
    <circle cx="560" cy="680" r="12" fill-opacity="0.7"/>
    <circle cx="980" cy="600" r="10" fill-opacity="0.5"/>
    <circle cx="1080" cy="300" r="15" fill-opacity="0.85"/>
    <circle cx="900" cy="120" r="9" fill-opacity="0.5"/>
    <circle cx="470" cy="90" r="11" fill-opacity="0.6"/>
  </g>
  <!-- 中心の想起（呼び戻された核） -->
  <circle cx="600" cy="375" r="150" fill="url(#core3)"/>
  <circle cx="600" cy="375" r="150" fill="none" stroke="rgba(250,246,236,0.3)" stroke-width="1.5"/>
  <circle cx="600" cy="375" r="220" fill="none" stroke="rgba(140,196,208,0.2)" stroke-width="1.5" stroke-dasharray="2 12"/>
</svg>
