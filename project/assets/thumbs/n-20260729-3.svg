<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 装飾を削いだ波形が、同じ基準線の上で繰り返し続く（音声・継続の一貫性） -->
  <defs>
    <linearGradient id="bgv" gradientTransform="rotate(-14)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="62%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8CC4D0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#7BBAD4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgv)"/>

  <!-- 残響（前の回の波形） -->
  <g fill="rgba(250,246,236,0.09)" transform="translate(34 0)">
    <rect x="120" y="330" width="16" height="90" rx="8"/>
    <rect x="176" y="272" width="16" height="206" rx="8"/>
    <rect x="232" y="196" width="16" height="358" rx="8"/>
    <rect x="288" y="300" width="16" height="150" rx="8"/>
    <rect x="344" y="238" width="16" height="274" rx="8"/>
    <rect x="400" y="146" width="16" height="458" rx="8"/>
    <rect x="456" y="286" width="16" height="178" rx="8"/>
    <rect x="512" y="216" width="16" height="318" rx="8"/>
    <rect x="568" y="322" width="16" height="106" rx="8"/>
    <rect x="624" y="254" width="16" height="242" rx="8"/>
    <rect x="680" y="180" width="16" height="390" rx="8"/>
    <rect x="736" y="308" width="16" height="134" rx="8"/>
    <rect x="792" y="232" width="16" height="286" rx="8"/>
    <rect x="848" y="296" width="16" height="158" rx="8"/>
    <rect x="904" y="204" width="16" height="342" rx="8"/>
    <rect x="960" y="326" width="16" height="98" rx="8"/>
  </g>

  <!-- 基準線（変わらない態度） -->
  <line x1="60" y1="375" x2="1140" y2="375" stroke="rgba(250,246,236,0.28)" stroke-width="1.4"/>

  <!-- いまの波形 -->
  <g fill="url(#bar)">
    <rect x="120" y="335" width="20" height="80" rx="10"/>
    <rect x="176" y="277" width="20" height="196" rx="10"/>
    <rect x="232" y="201" width="20" height="348" rx="10"/>
    <rect x="288" y="305" width="20" height="140" rx="10"/>
    <rect x="344" y="243" width="20" height="264" rx="10"/>
    <rect x="400" y="151" width="20" height="448" rx="10"/>
    <rect x="456" y="291" width="20" height="168" rx="10"/>
    <rect x="512" y="221" width="20" height="308" rx="10"/>
    <rect x="568" y="327" width="20" height="96" rx="10"/>
    <rect x="624" y="259" width="20" height="232" rx="10"/>
    <rect x="680" y="185" width="20" height="380" rx="10"/>
    <rect x="736" y="313" width="20" height="124" rx="10"/>
    <rect x="792" y="237" width="20" height="276" rx="10"/>
    <rect x="848" y="301" width="20" height="148" rx="10"/>
    <rect x="904" y="209" width="20" height="332" rx="10"/>
    <rect x="960" y="331" width="20" height="88" rx="10"/>
    <rect x="1016" y="263" width="20" height="224" rx="10"/>
  </g>

  <!-- 広がり -->
  <g fill="none" stroke="rgba(200,164,196,0.30)">
    <circle cx="1096" cy="375" r="64" stroke-width="1.6"/>
    <circle cx="1096" cy="375" r="112" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="1096" cy="375" r="168" stroke-width="1" stroke-opacity="0.4"/>
  </g>
  <circle cx="1096" cy="375" r="16" fill="rgba(250,246,236,0.7)"/>
</svg>
