<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 積み上がった判断の地層はそのままに、
       それを囲っていた古い枠が外れ、新しい枠が同じ地層の上に降りてくる（名前は器、履歴が中身） -->
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(52)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="50%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="strata" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C8A4C4" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#9B8CC8" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#7BBAD4" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- 積み上がった判断の履歴（地層）— 位置も厚みも一切変わらない -->
  <g>
    <rect x="380" y="616" width="440" height="66" fill="url(#strata)"/>
    <rect x="380" y="566" width="440" height="48" fill="#9B8CC8" opacity="0.7"/>
    <rect x="380" y="524" width="440" height="40" fill="#8CC4D0" opacity="0.5"/>
    <rect x="380" y="488" width="440" height="34" fill="#7BBAD4" opacity="0.38"/>
    <rect x="380" y="458" width="440" height="28" fill="rgba(250,246,236,0.2)"/>
    <rect x="380" y="434" width="440" height="22" fill="#C8A4C4" opacity="0.28"/>
  </g>
  <g stroke="rgba(250,246,236,0.28)" stroke-width="1.2">
    <line x1="380" y1="616" x2="820" y2="616"/>
    <line x1="380" y1="566" x2="820" y2="566"/>
    <line x1="380" y1="524" x2="820" y2="524"/>
    <line x1="380" y1="488" x2="820" y2="488"/>
    <line x1="380" y1="458" x2="820" y2="458"/>
  </g>
  <!-- 地層の断面に残る、日々の判断の粒 -->
  <g fill="rgba(250,246,236,0.5)">
    <circle cx="452" cy="646" r="4"/><circle cx="596" cy="590" r="3.5"/>
    <circle cx="712" cy="544" r="4"/><circle cx="510" cy="506" r="3"/>
    <circle cx="758" cy="640" r="3.5"/><circle cx="644" cy="470" r="3"/>
  </g>

  <!-- 外れていく古い枠（同じ地層を囲っていた、いまはほどけつつある輪郭） -->
  <g opacity="0.5">
    <path d="M300 372 L300 700 L744 700 L744 372"
          fill="none" stroke="rgba(250,246,236,0.34)" stroke-width="3"
          stroke-dasharray="30 26" stroke-linecap="round"/>
    <path d="M300 372 L744 372" fill="none" stroke="rgba(250,246,236,0.2)"
          stroke-width="2" stroke-dasharray="14 22"/>
  </g>
  <!-- 枠が外れていく軌跡 -->
  <g stroke="rgba(250,246,236,0.16)" stroke-width="1.2" fill="none">
    <path d="M300 372 C 236 316, 190 264, 168 200"/>
    <path d="M300 700 C 228 664, 176 604, 152 528"/>
  </g>
  <path d="M118 152 L118 250 L214 250" fill="none"
        stroke="rgba(250,246,236,0.18)" stroke-width="2" stroke-dasharray="8 14"/>

  <!-- 降りてくる新しい枠（同じ地層の上に、はっきりした一本の線で着地する） -->
  <path d="M356 398 L356 706 L856 706 L856 398"
        fill="none" stroke="rgba(250,246,236,0.85)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M356 398 L856 398" fill="none" stroke="#8CC4D0" stroke-width="4"/>
  <!-- 着地の合図 -->
  <g stroke="#8CC4D0" stroke-width="1.6" fill="none" opacity="0.6">
    <path d="M420 340 L420 386"/><path d="M606 322 L606 386"/><path d="M792 340 L792 386"/>
  </g>
  <g fill="#8CC4D0" opacity="0.85">
    <circle cx="420" cy="330" r="5"/><circle cx="606" cy="312" r="6.5"/><circle cx="792" cy="330" r="5"/>
  </g>

  <!-- 器が替わっても減らない中身を示す、静かな同心 -->
  <circle cx="1010" cy="220" r="132" fill="none" stroke="rgba(155,140,200,0.22)" stroke-width="1.5"/>
  <circle cx="1010" cy="220" r="84" fill="none" stroke="rgba(155,140,200,0.15)" stroke-width="1"/>
  <circle cx="1010" cy="220" r="34" fill="rgba(200,164,196,0.3)"/>
  <circle cx="1010" cy="220" r="10" fill="rgba(250,246,236,0.6)"/>
  <circle cx="1136" cy="642" r="6" fill="rgba(139,196,208,0.4)"/>
  <circle cx="94" cy="686" r="4" fill="rgba(250,246,236,0.22)"/>
</svg>
