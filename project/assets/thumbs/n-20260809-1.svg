<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 名前という「器」に、判断が層となって沈み、時間をかけて意味が溜まっていく -->
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(28)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="55%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="sediment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8CC4D0" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#9B8CC8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="vessel">
      <path d="M330 150 L330 470 A270 210 0 0 0 870 470 L870 150 L830 150 L830 470 A230 176 0 0 1 370 470 L370 150 Z M370 150"/>
    </clipPath>
    <clipPath id="inner">
      <path d="M370 150 L370 470 A230 176 0 0 0 830 470 L830 150 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- 器の外周（名前そのものは薄い輪郭にすぎない） -->
  <path d="M330 150 L330 470 A270 210 0 0 0 870 470 L870 150"
        fill="none" stroke="rgba(250,246,236,0.34)" stroke-width="3"/>
  <path d="M370 150 L370 470 A230 176 0 0 0 830 470 L830 150"
        fill="none" stroke="rgba(250,246,236,0.16)" stroke-width="1.5"/>

  <!-- 器の中に沈殿していく判断の層 -->
  <g clip-path="url(#inner)">
    <rect x="360" y="600" width="480" height="80" fill="url(#sediment)"/>
    <rect x="360" y="560" width="480" height="44" fill="#9B8CC8" opacity="0.62"/>
    <rect x="360" y="524" width="480" height="38" fill="#8CC4D0" opacity="0.42"/>
    <rect x="360" y="494" width="480" height="32" fill="#7BBAD4" opacity="0.3"/>
    <rect x="360" y="470" width="480" height="26" fill="rgba(250,246,236,0.18)"/>
    <!-- 層の境目 -->
    <line x1="360" y1="600" x2="840" y2="600" stroke="rgba(250,246,236,0.3)" stroke-width="1.5"/>
    <line x1="360" y1="560" x2="840" y2="560" stroke="rgba(250,246,236,0.22)" stroke-width="1.5"/>
    <line x1="360" y1="524" x2="840" y2="524" stroke="rgba(250,246,236,0.16)" stroke-width="1"/>
    <line x1="360" y1="494" x2="840" y2="494" stroke="rgba(250,246,236,0.12)" stroke-width="1"/>
  </g>

  <!-- 上から降り続ける、日々の判断 -->
  <g fill="rgba(250,246,236,0.55)">
    <circle cx="452" cy="112" r="4"/>
    <circle cx="536" cy="196" r="6"/>
    <circle cx="612" cy="128" r="3.5"/>
    <circle cx="688" cy="238" r="5"/>
    <circle cx="746" cy="150" r="4"/>
  </g>
  <g fill="#9B8CC8" opacity="0.75">
    <circle cx="492" cy="300" r="7"/>
    <circle cx="640" cy="352" r="5"/>
    <circle cx="716" cy="316" r="4"/>
  </g>
  <g fill="#7BBAD4" opacity="0.7">
    <circle cx="574" cy="404" r="6"/>
    <circle cx="668" cy="436" r="4.5"/>
  </g>
  <g stroke="rgba(250,246,236,0.2)" stroke-width="1.2">
    <line x1="452" y1="124" x2="452" y2="286"/>
    <line x1="612" y1="140" x2="612" y2="330"/>
    <line x1="746" y1="162" x2="746" y2="300"/>
  </g>

  <!-- 器の外に散る、貯まらなかったもの -->
  <circle cx="180" cy="238" r="94" fill="none" stroke="rgba(250,246,236,0.15)" stroke-width="1.5"/>
  <circle cx="1046" cy="596" r="128" fill="none" stroke="rgba(200,164,196,0.22)" stroke-width="1.5"/>
  <circle cx="1046" cy="596" r="76" fill="none" stroke="rgba(200,164,196,0.14)" stroke-width="1"/>
  <circle cx="146" cy="640" r="7" fill="rgba(250,246,236,0.24)"/>
  <circle cx="1112" cy="176" r="5" fill="rgba(139,196,208,0.4)"/>
</svg>
