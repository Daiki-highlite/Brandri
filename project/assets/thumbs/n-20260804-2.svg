<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 一つの原点から広がる二組の軌跡。同じ角度の物差しに沿う束と、軸を離れて薄れる束（ブランド拡張の作法） -->
  <defs>
    <linearGradient id="bg2" gradientTransform="rotate(18)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="52%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="ray2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A4C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="fade2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B8CC8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core2">
      <stop offset="0%" stop-color="#C8A4C4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <circle cx="150" cy="375" r="300" fill="url(#core2)"/>

  <!-- 物差し（同心の距離目盛り） -->
  <g fill="none" stroke="rgba(250,246,236,0.13)" stroke-width="1.2">
    <circle cx="150" cy="375" r="230"/>
    <circle cx="150" cy="375" r="420"/>
    <circle cx="150" cy="375" r="610"/>
    <circle cx="150" cy="375" r="800"/>
  </g>

  <!-- 上半分: 物差しに沿って揃って広がる束 -->
  <g stroke="url(#ray2)" stroke-linecap="round">
    <line x1="150" y1="375" x2="1090" y2="118" stroke-width="7"/>
    <line x1="150" y1="375" x2="1110" y2="196" stroke-width="7"/>
    <line x1="150" y1="375" x2="1120" y2="274" stroke-width="7"/>
    <line x1="150" y1="375" x2="1124" y2="352" stroke-width="7"/>
  </g>
  <!-- 揃った束の到達点 -->
  <g fill="rgba(250,246,236,0.55)">
    <circle cx="1090" cy="118" r="7"/>
    <circle cx="1110" cy="196" r="7"/>
    <circle cx="1120" cy="274" r="7"/>
    <circle cx="1124" cy="352" r="7"/>
  </g>

  <!-- 下半分: 同じだけ広がるが、軸から外れて散り、薄れていく束 -->
  <g stroke="url(#fade2)" stroke-linecap="round">
    <line x1="150" y1="375" x2="980" y2="486" stroke-width="6"/>
    <line x1="150" y1="375" x2="880" y2="592" stroke-width="5"/>
    <line x1="150" y1="375" x2="742" y2="668" stroke-width="5"/>
    <line x1="150" y1="375" x2="560" y2="716" stroke-width="4"/>
    <line x1="150" y1="375" x2="1046" y2="430" stroke-width="4"/>
  </g>
  <g fill="rgba(155,140,200,0.30)">
    <circle cx="980" cy="486" r="5"/>
    <circle cx="880" cy="592" r="4.5"/>
    <circle cx="742" cy="668" r="4"/>
    <circle cx="560" cy="716" r="3.5"/>
    <circle cx="1046" cy="430" r="3.5"/>
  </g>

  <!-- 原点 -->
  <circle cx="150" cy="375" r="34" fill="rgba(250,246,236,0.16)"/>
  <circle cx="150" cy="375" r="34" fill="none" stroke="rgba(250,246,236,0.45)" stroke-width="1.6"/>
  <circle cx="150" cy="375" r="11" fill="rgba(250,246,236,0.80)"/>

  <!-- 軸線（守るべき方向） -->
  <line x1="150" y1="375" x2="1160" y2="375" stroke="rgba(250,246,236,0.20)" stroke-width="1.2" stroke-dasharray="10 12"/>
</svg>
