<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 時間をかけて積み上げた価格帯の柱が、空いた隙間に差し込まれる（ポートフォリオ・一貫性） -->
  <defs>
    <linearGradient id="bg2" gradientTransform="rotate(18)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="55%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="fill2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7BBAD4"/>
      <stop offset="100%" stop-color="#8CC4D0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <!-- 積み上げてきた複数ブランドの柱（価格帯ごとに高さが違う） -->
  <g>
    <rect x="150" y="470" width="96" height="200" fill="rgba(250,246,236,0.10)"/>
    <rect x="150" y="430" width="96" height="40" fill="rgba(250,246,236,0.16)"/>
    <rect x="150" y="390" width="96" height="40" fill="rgba(155,140,200,0.30)"/>

    <rect x="290" y="400" width="96" height="270" fill="rgba(250,246,236,0.10)"/>
    <rect x="290" y="350" width="96" height="50" fill="rgba(250,246,236,0.16)"/>
    <rect x="290" y="300" width="96" height="50" fill="rgba(200,164,196,0.32)"/>

    <!-- 空いた隙間（スイス勢の値上げが作った空白地帯） -->
    <rect x="430" y="240" width="96" height="430" fill="rgba(21,26,51,0.35)" stroke="rgba(250,246,236,0.18)" stroke-width="2" stroke-dasharray="8 10"/>

    <rect x="570" y="360" width="96" height="310" fill="rgba(250,246,236,0.10)"/>
    <rect x="570" y="300" width="96" height="60" fill="rgba(250,246,236,0.16)"/>
    <rect x="570" y="240" width="96" height="60" fill="rgba(155,140,200,0.30)"/>

    <rect x="710" y="300" width="96" height="370" fill="rgba(250,246,236,0.10)"/>
    <rect x="710" y="230" width="96" height="70" fill="rgba(250,246,236,0.16)"/>
    <rect x="710" y="160" width="96" height="70" fill="rgba(200,164,196,0.32)"/>
  </g>
  <!-- 隙間に差し込まれる、いま開花した一本（明るく） -->
  <g>
    <rect x="850" y="180" width="110" height="490" fill="url(#fill2)"/>
    <rect x="850" y="180" width="110" height="10" fill="rgba(250,246,236,0.85)"/>
  </g>
  <rect x="1000" y="470" width="96" height="200" fill="rgba(250,246,236,0.08)"/>
  <rect x="1000" y="430" width="96" height="40" fill="rgba(250,246,236,0.13)"/>
  <!-- 積み上げの時間を示す基線 -->
  <line x1="120" y1="670" x2="1120" y2="670" stroke="rgba(250,246,236,0.35)" stroke-width="2"/>
</svg>
