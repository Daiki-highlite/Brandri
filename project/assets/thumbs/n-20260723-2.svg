<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 中央の判断基準ノードが、AIを通じて周縁の担い手へ同じ基準を配る（属人ノウハウの標準化） -->
  <defs>
    <linearGradient id="bg2" gradientTransform="rotate(135)">
      <stop offset="0%" stop-color="#28355C"/>
      <stop offset="55%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#7BBAD4"/>
    </linearGradient>
    <radialGradient id="core2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF6EC" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#8CC4D0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8CC4D0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <!-- 配信の放射線（基準が全員に届く） -->
  <g stroke="rgba(250,246,236,0.5)" stroke-width="1.6" fill="none">
    <path d="M600 375 L240 150"/>
    <path d="M600 375 L980 130"/>
    <path d="M600 375 L200 470"/>
    <path d="M600 375 L300 660"/>
    <path d="M600 375 L1010 420"/>
    <path d="M600 375 L860 640"/>
    <path d="M600 375 L1060 610"/>
    <path d="M600 375 L120 300"/>
  </g>
  <!-- 周縁の担い手ノード（同じ基準を映す） -->
  <g fill="rgba(155,140,200,0.85)" stroke="rgba(250,246,236,0.7)" stroke-width="1.4">
    <circle cx="240" cy="150" r="18"/>
    <circle cx="980" cy="130" r="16"/>
    <circle cx="200" cy="470" r="15"/>
    <circle cx="300" cy="660" r="17"/>
    <circle cx="1010" cy="420" r="19"/>
    <circle cx="860" cy="640" r="15"/>
    <circle cx="1060" cy="610" r="13"/>
    <circle cx="120" cy="300" r="13"/>
  </g>
  <!-- 各ノードの内側リング（判断が再現されている印） -->
  <g fill="none" stroke="rgba(250,246,236,0.45)" stroke-width="1">
    <circle cx="240" cy="150" r="30"/>
    <circle cx="1010" cy="420" r="32"/>
    <circle cx="300" cy="660" r="29"/>
  </g>
  <!-- 中央: 判断基準のコア -->
  <circle cx="600" cy="375" r="180" fill="url(#core2)"/>
  <circle cx="600" cy="375" r="46" fill="#1E2340"/>
  <circle cx="600" cy="375" r="46" fill="none" stroke="#FAF6EC" stroke-width="2.5"/>
  <circle cx="600" cy="375" r="78" fill="none" stroke="rgba(250,246,236,0.55)" stroke-width="1.4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <circle cx="600" cy="375" r="14" fill="#7BBAD4"/>
  <!-- 粒子 -->
  <g fill="rgba(250,246,236,0.55)">
    <circle cx="470" cy="120" r="2.2"/>
    <circle cx="760" cy="230" r="1.8"/>
    <circle cx="430" cy="560" r="2.4"/>
    <circle cx="740" cy="520" r="1.8"/>
  </g>
</svg>
