<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="60%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#7BBAD4"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(250,246,236,0.95)"/>
      <stop offset="35%" stop-color="#C8A4C4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <!-- 間取り: 入れ子の部屋 -->
  <g fill="none" stroke="rgba(250,246,236,0.28)" stroke-width="1.5">
    <rect x="180" y="95" width="840" height="560"/>
    <rect x="290" y="170" width="620" height="410"/>
    <rect x="410" y="250" width="380" height="250"/>
    <line x1="180" y1="375" x2="290" y2="375"/>
    <line x1="910" y1="375" x2="1020" y2="375"/>
    <line x1="600" y1="95" x2="600" y2="170"/>
    <line x1="600" y1="580" x2="600" y2="655"/>
    <line x1="290" y1="250" x2="410" y2="250"/>
    <line x1="790" y1="500" x2="910" y2="500"/>
  </g>
  <!-- 部屋の面 -->
  <rect x="180" y="95" width="230" height="155" fill="#7BBAD4" opacity="0.14"/>
  <rect x="790" y="500" width="230" height="155" fill="#8CC4D0" opacity="0.16"/>
  <rect x="910" y="95" width="110" height="280" fill="#9B8CC8" opacity="0.18"/>
  <rect x="180" y="500" width="110" height="155" fill="#C8A4C4" opacity="0.16"/>
  <!-- 中心から通路へ届く光 -->
  <g stroke="rgba(250,246,236,0.35)" stroke-width="1" stroke-dasharray="4 8">
    <line x1="600" y1="375" x2="180" y2="375"/>
    <line x1="600" y1="375" x2="1020" y2="375"/>
    <line x1="600" y1="375" x2="600" y2="95"/>
    <line x1="600" y1="375" x2="600" y2="655"/>
  </g>
  <circle cx="600" cy="375" r="190" fill="url(#core)" opacity="0.55"/>
  <rect x="560" y="335" width="80" height="80" fill="rgba(250,246,236,0.9)"/>
  <rect x="545" y="320" width="110" height="110" fill="none" stroke="#C8A4C4" stroke-width="2"/>
</svg>
