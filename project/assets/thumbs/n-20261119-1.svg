<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="60%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#9B8CC8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.62" cy="0.5" r="0.42">
      <stop offset="0%" stop-color="rgba(250,246,236,0.22)"/>
      <stop offset="100%" stop-color="rgba(250,246,236,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#halo)"/>
  <!-- scattered single pieces (individual items) -->
  <g opacity="0.55">
    <rect x="90" y="120" width="120" height="70" rx="6" fill="#7BBAD4" transform="rotate(-14 150 155)"/>
    <rect x="150" y="430" width="90" height="140" rx="6" fill="#C8A4C4" transform="rotate(11 195 500)"/>
    <rect x="300" y="250" width="70" height="70" rx="35" fill="#8CC4D0"/>
    <rect x="260" y="590" width="130" height="50" rx="6" fill="#9B8CC8" transform="rotate(-6 325 615)"/>
  </g>
  <!-- guiding curves: the editor's eye pulling pieces together -->
  <g fill="none" stroke="rgba(250,246,236,0.35)" stroke-width="1.4" stroke-dasharray="4 8">
    <path d="M210 150 C 400 140, 560 220, 680 250"/>
    <path d="M240 500 C 420 520, 560 470, 680 440"/>
    <path d="M370 285 C 480 300, 580 340, 700 350"/>
    <path d="M390 615 C 520 620, 620 560, 720 540"/>
  </g>
  <!-- composed whole: layered, aligned pieces -->
  <g transform="translate(660 170)">
    <rect x="0" y="0" width="300" height="130" rx="10" fill="#7BBAD4" opacity="0.92"/>
    <rect x="30" y="110" width="240" height="190" rx="10" fill="#C8A4C4" opacity="0.88"/>
    <rect x="60" y="280" width="180" height="90" rx="10" fill="#9B8CC8" opacity="0.92"/>
    <circle cx="150" cy="190" r="34" fill="#8CC4D0" opacity="0.95"/>
    <rect x="-20" y="-20" width="340" height="410" rx="16" fill="none" stroke="rgba(250,246,236,0.6)" stroke-width="1.6"/>
  </g>
  <line x1="640" y1="620" x2="1000" y2="620" stroke="rgba(250,246,236,0.45)" stroke-width="1"/>
</svg>
