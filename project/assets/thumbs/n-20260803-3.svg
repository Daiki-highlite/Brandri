<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 中心が自ら発するのではなく、外側の複数の点から中心へ線が集まる（他者の言及が輪郭をつくる） -->
  <defs>
    <linearGradient id="a3bg" gradientTransform="rotate(64)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="50%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <radialGradient id="a3glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8CC4D0" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#8CC4D0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(250,246,236,0.30)"/>
      <stop offset="100%" stop-color="rgba(250,246,236,0.04)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#a3bg)"/>
  <rect width="1200" height="750" fill="url(#a3glow)"/>

  <!-- 外から中心へ集まる線 -->
  <g fill="none" stroke-linecap="round">
    <path d="M118 148 C 300 244, 420 316, 512 358" stroke="#7BBAD4" stroke-opacity="0.58" stroke-width="2.4"/>
    <path d="M352 78 C 452 214, 502 300, 552 340" stroke="#9B8CC8" stroke-opacity="0.50" stroke-width="1.8"/>
    <path d="M636 52 C 622 190, 616 288, 610 330" stroke="#C8A4C4" stroke-opacity="0.62" stroke-width="2.8"/>
    <path d="M918 96 C 812 218, 726 296, 660 344" stroke="#8CC4D0" stroke-opacity="0.54" stroke-width="2.0"/>
    <path d="M1128 244 C 950 306, 796 350, 692 372" stroke="#7BBAD4" stroke-opacity="0.66" stroke-width="3.0"/>
    <path d="M1150 486 C 972 456, 812 414, 700 398" stroke="#9B8CC8" stroke-opacity="0.46" stroke-width="1.7"/>
    <path d="M1006 674 C 872 566, 764 476, 686 424" stroke="#C8A4C4" stroke-opacity="0.56" stroke-width="2.3"/>
    <path d="M712 728 C 682 604, 662 502, 646 442" stroke="#8CC4D0" stroke-opacity="0.60" stroke-width="2.6"/>
    <path d="M416 706 C 496 590, 552 494, 592 438" stroke="#7BBAD4" stroke-opacity="0.44" stroke-width="1.6"/>
    <path d="M140 588 C 316 512, 448 452, 540 416" stroke="#9B8CC8" stroke-opacity="0.58" stroke-width="2.2"/>
    <path d="M52 372 C 244 372, 412 380, 516 386" stroke="#C8A4C4" stroke-opacity="0.40" stroke-width="1.5"/>
  </g>

  <!-- 外側の起点（他者） -->
  <g>
    <circle cx="118" cy="148" r="10.5" fill="#7BBAD4" fill-opacity="0.70"/>
    <circle cx="352" cy="78" r="7.2" fill="#9B8CC8" fill-opacity="0.64"/>
    <circle cx="636" cy="52" r="13.5" fill="#C8A4C4" fill-opacity="0.72"/>
    <circle cx="918" cy="96" r="8.6" fill="#8CC4D0" fill-opacity="0.66"/>
    <circle cx="1128" cy="244" r="15" fill="#7BBAD4" fill-opacity="0.74"/>
    <circle cx="1150" cy="486" r="6.8" fill="#9B8CC8" fill-opacity="0.60"/>
    <circle cx="1006" cy="674" r="11.4" fill="#C8A4C4" fill-opacity="0.68"/>
    <circle cx="712" cy="728" r="12.6" fill="#8CC4D0" fill-opacity="0.70"/>
    <circle cx="416" cy="706" r="6.2" fill="#7BBAD4" fill-opacity="0.58"/>
    <circle cx="140" cy="588" r="9.8" fill="#9B8CC8" fill-opacity="0.72"/>
    <circle cx="52" cy="372" r="5.6" fill="#C8A4C4" fill-opacity="0.56"/>
  </g>

  <!-- 中心：外からの線が重なった結果として現れる輪郭 -->
  <circle cx="602" cy="384" r="152" fill="none" stroke="rgba(250,246,236,0.10)" stroke-width="1"/>
  <circle cx="602" cy="384" r="104" fill="none" stroke="rgba(250,246,236,0.20)" stroke-width="1.4"/>
  <circle cx="602" cy="384" r="62" fill="url(#a3core)" stroke="rgba(250,246,236,0.44)" stroke-width="2"/>
  <circle cx="602" cy="384" r="22" fill="rgba(250,246,236,0.26)"/>
</svg>
