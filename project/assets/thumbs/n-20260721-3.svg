<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 曖昧なノード網の中を、AIが一つの"基準が明快なブランド"へと経路を選び取る（AIエージェント購買） -->
  <defs>
    <linearGradient id="bg3" gradientTransform="rotate(150)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="60%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <radialGradient id="beacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(250,246,236,0.95)"/>
      <stop offset="45%" stop-color="#7BBAD4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7BBAD4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg3)"/>
  <!-- 曖昧な網（その他大勢） -->
  <g stroke="rgba(250,246,236,0.12)" stroke-width="1.2">
    <line x1="150" y1="200" x2="300" y2="330"/>
    <line x1="300" y1="330" x2="220" y2="500"/>
    <line x1="220" y1="500" x2="400" y2="560"/>
    <line x1="300" y1="330" x2="470" y2="300"/>
    <line x1="470" y1="300" x2="400" y2="560"/>
    <line x1="150" y1="200" x2="470" y2="300"/>
    <line x1="400" y1="560" x2="560" y2="470"/>
    <line x1="470" y1="300" x2="560" y2="470"/>
    <line x1="220" y1="500" x2="120" y2="620"/>
  </g>
  <g fill="rgba(155,140,200,0.55)">
    <circle cx="150" cy="200" r="7"/>
    <circle cx="300" cy="330" r="9"/>
    <circle cx="220" cy="500" r="7"/>
    <circle cx="400" cy="560" r="8"/>
    <circle cx="470" cy="300" r="7"/>
    <circle cx="120" cy="620" r="6"/>
  </g>
  <!-- AIが選び取る、明快な経路（強調） -->
  <path d="M300 330 L 470 300 L 560 470 L 720 420 L 900 360" fill="none" stroke="rgba(140,196,208,0.85)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="560" cy="470" r="9" fill="#8CC4D0"/>
  <circle cx="720" cy="420" r="9" fill="#7BBAD4"/>
  <!-- 目的地: 基準が明快なブランド（灯台のように読める一点） -->
  <circle cx="960" cy="345" r="185" fill="url(#beacon)"/>
  <polygon points="960,255 1050,345 960,435 870,345" fill="rgba(123,186,212,0.4)" stroke="rgba(250,246,236,0.7)" stroke-width="2"/>
  <circle cx="960" cy="345" r="16" fill="rgba(250,246,236,0.98)"/>
  <!-- 微光 -->
  <circle cx="820" cy="180" r="3" fill="rgba(250,246,236,0.6)"/>
  <circle cx="1080" cy="520" r="3.5" fill="rgba(140,196,208,0.6)"/>
  <circle cx="640" cy="620" r="2.6" fill="rgba(250,246,236,0.4)"/>
</svg>
