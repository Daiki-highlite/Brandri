<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 二つの円環（二つのファンダム）が重なり、散らばる分析点が交点へ集束する（半年のファン分析） -->
  <defs>
    <linearGradient id="bg2" gradientTransform="rotate(52)">
      <stop offset="0%" stop-color="#3D2F55"/>
      <stop offset="55%" stop-color="#9B8CC8"/>
      <stop offset="100%" stop-color="#C8A4C4"/>
    </linearGradient>
    <radialGradient id="lens2">
      <stop offset="0%" stop-color="#FAF6EC" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#FAF6EC" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FAF6EC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <!-- 円環A（ブランド） -->
  <g fill="none" stroke="rgba(250,246,236,0.7)">
    <circle cx="500" cy="375" r="210" stroke-width="2"/>
    <circle cx="500" cy="375" r="150" stroke-width="1.2" opacity="0.6"/>
    <circle cx="500" cy="375" r="86" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- 円環B（アーティストのファン） -->
  <g fill="none" stroke="rgba(30,35,64,0.55)">
    <circle cx="740" cy="375" r="210" stroke-width="2"/>
    <circle cx="740" cy="375" r="150" stroke-width="1.2" opacity="0.7"/>
    <circle cx="740" cy="375" r="86" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- 重なり（コラボの交点＝届く一点） -->
  <ellipse cx="620" cy="375" rx="115" ry="170" fill="url(#lens2)"/>
  <circle cx="620" cy="375" r="14" fill="#1E2340"/>
  <!-- 散らばる分析点が交点へ流れ込む（半年の観察） -->
  <g fill="none" stroke="rgba(250,246,236,0.4)" stroke-width="1.3" stroke-dasharray="3 7">
    <path d="M170 160 C 360 250, 480 320, 585 360"/>
    <path d="M210 610 C 380 520, 500 440, 600 400"/>
    <path d="M1050 190 C 850 260, 720 320, 655 358"/>
    <path d="M1030 600 C 860 520, 730 440, 655 398"/>
  </g>
  <g fill="rgba(250,246,236,0.75)">
    <circle cx="170" cy="160" r="3.2"/>
    <circle cx="210" cy="610" r="2.8"/>
    <circle cx="1050" cy="190" r="3"/>
    <circle cx="1030" cy="600" r="2.6"/>
    <circle cx="300" cy="250" r="2"/>
    <circle cx="330" cy="520" r="2.2"/>
    <circle cx="930" cy="270" r="2"/>
    <circle cx="900" cy="520" r="1.8"/>
    <circle cx="440" cy="130" r="1.6"/>
    <circle cx="820" cy="140" r="1.8"/>
  </g>
</svg>
