<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 日々の発信が、共有された一本の基準線に揃っていく（左＝基準なく漂う／右＝基準に接地する） -->
  <defs>
    <linearGradient id="bg272" gradientTransform="rotate(160)">
      <stop offset="0%" stop-color="#28355C"/>
      <stop offset="58%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="rule272" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0%" stop-color="rgba(250,246,236,0.10)"/>
      <stop offset="32%" stop-color="rgba(250,246,236,0.55)"/>
      <stop offset="100%" stop-color="rgba(250,246,236,0.95)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg272)"/>

  <!-- 基準のない領域：接地しないまま漂う断片 -->
  <g fill="rgba(250,246,236,0.16)">
    <rect x="70" y="286" width="26" height="96" rx="4" transform="rotate(-13 83 334)"/>
    <rect x="132" y="392" width="26" height="132" rx="4" transform="rotate(9 145 458)"/>
    <rect x="196" y="248" width="26" height="78" rx="4" transform="rotate(17 209 287)"/>
    <rect x="252" y="430" width="26" height="104" rx="4" transform="rotate(-7 265 482)"/>
    <rect x="316" y="316" width="26" height="120" rx="4" transform="rotate(12 329 376)"/>
  </g>
  <g fill="rgba(155,140,200,0.28)">
    <rect x="104" y="500" width="26" height="70" rx="4" transform="rotate(-20 117 535)"/>
    <rect x="368" y="222" width="26" height="88" rx="4" transform="rotate(-9 381 266)"/>
  </g>

  <!-- 基準に落ちる影＝同じ土台の上にあることの表れ -->
  <g fill="rgba(21,26,51,0.30)">
    <rect x="452" y="470" width="30" height="44" rx="3"/>
    <rect x="506" y="470" width="30" height="60" rx="3"/>
    <rect x="560" y="470" width="30" height="32" rx="3"/>
    <rect x="614" y="470" width="30" height="72" rx="3"/>
    <rect x="668" y="470" width="30" height="48" rx="3"/>
    <rect x="722" y="470" width="30" height="64" rx="3"/>
    <rect x="776" y="470" width="30" height="36" rx="3"/>
    <rect x="830" y="470" width="30" height="80" rx="3"/>
    <rect x="884" y="470" width="30" height="52" rx="3"/>
    <rect x="938" y="470" width="30" height="62" rx="3"/>
    <rect x="992" y="470" width="30" height="40" rx="3"/>
    <rect x="1046" y="470" width="30" height="70" rx="3"/>
  </g>

  <!-- 共有された判断基準＝一本の水平線（影の上に引き、すべての起点になる） -->
  <rect x="40" y="468" width="1120" height="4" fill="url(#rule272)"/>

  <!-- 基準に接地して立ち上がる発信の連なり -->
  <g>
    <rect x="452" y="352" width="30" height="118" rx="4" fill="rgba(250,246,236,0.28)"/>
    <rect x="506" y="286" width="30" height="184" rx="4" fill="rgba(123,186,212,0.55)"/>
    <rect x="560" y="392" width="30" height="78" rx="4" fill="rgba(250,246,236,0.34)"/>
    <rect x="614" y="228" width="30" height="242" rx="4" fill="rgba(155,140,200,0.72)"/>
    <rect x="668" y="330" width="30" height="140" rx="4" fill="rgba(250,246,236,0.40)"/>
    <rect x="722" y="264" width="30" height="206" rx="4" fill="rgba(200,164,196,0.68)"/>
    <rect x="776" y="376" width="30" height="94" rx="4" fill="rgba(250,246,236,0.32)"/>
    <rect x="830" y="196" width="30" height="274" rx="4" fill="rgba(140,196,208,0.72)"/>
    <rect x="884" y="318" width="30" height="152" rx="4" fill="rgba(250,246,236,0.42)"/>
    <rect x="938" y="272" width="30" height="198" rx="4" fill="rgba(123,186,212,0.62)"/>
    <rect x="992" y="360" width="30" height="110" rx="4" fill="rgba(250,246,236,0.30)"/>
    <rect x="1046" y="240" width="30" height="230" rx="4" fill="rgba(155,140,200,0.60)"/>
  </g>

  <!-- 接地点 -->
  <g fill="#FAF6EC">
    <circle cx="629" cy="470" r="5"/>
    <circle cx="845" cy="470" r="5"/>
    <circle cx="521" cy="470" r="3.5"/>
    <circle cx="1061" cy="470" r="3.5"/>
  </g>
</svg>
