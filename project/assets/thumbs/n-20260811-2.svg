  <!-- 選ばれた三本（基準を通過して伸びる） -->
  <rect x="408" y="128" width="18" height="492" rx="7" fill="url(#chosen)"/>
  <rect x="606" y="96" width="18" height="524" rx="7" fill="url(#chosen)"/>
  <rect x="806" y="164" width="18" height="456" rx="7" fill="url(#chosen)"/>
  <circle cx="417" cy="128" r="13" fill="rgba(250,246,236,0.92)"/>
  <circle cx="615" cy="96" r="13" fill="rgba(250,246,236,0.92)"/>
  <circle cx="815" cy="164" r="13" fill="rgba(250,246,236,0.92)"/>

  <!-- 基準線（すべてを横切る一本） -->
  <line x1="0" y1="272" x2="1200" y2="272" stroke="rgba(250,246,236,0.55)" stroke-width="3"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="rgba(155,140,200,0.35)" stroke-width="1.5" stroke-dasharray="14 22"/>

  <!-- 接地面 -->
  <line x1="0" y1="620" x2="1200" y2="620" stroke="rgba(250,246,236,0.22)" stroke-width="2"/>

  <!-- 遠景の円弧 -->
  <circle cx="1010" cy="152" r="168" fill="none" stroke="rgba(140,196,208,0.16)" stroke-width="1.5"/>
  <circle cx="1010" cy="152" r="106" fill="none" stroke="rgba(140,196,208,0.1)" stroke-width="1"/>
