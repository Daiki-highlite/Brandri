<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 無数に並ぶ選択肢を一本の基準線が横切り、三本だけが選び取られて立ち上がる（選ぶ基準） -->
  <defs>
    <linearGradient id="bg2" gradientTransform="rotate(18)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="62%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="chosen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7BBAD4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FAF6EC" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FAF6EC" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>

  <!-- 選択肢の群れ（細い縦線・高さはまちまち） -->
