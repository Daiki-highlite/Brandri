<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 輪郭のはっきりした原型と、ずれてぼやける模倣（知財＝自社の輪郭の定義） -->
  <defs>
    <linearGradient id="bg1" gradientTransform="rotate(28)">
      <stop offset="0%" stop-color="#151A33"/>
      <stop offset="55%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <linearGradient id="core1" gradientTransform="rotate(120)">
      <stop offset="0%" stop-color="#7BBAD4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8CC4D0" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg1)"/>
  <!-- ずれてぼやける模倣（同じ形が輪郭を保てず後退する） -->
  <g fill="none">
    <polygon points="640,180 900,300 780,600 500,560 470,320" stroke="rgba(250,246,236,0.10)" stroke-width="2" transform="translate(70 46) rotate(6 640 380)"/>
    <polygon points="640,180 900,300 780,600 500,560 470,320" stroke="rgba(250,246,236,0.16)" stroke-width="2" transform="translate(42 26) rotate(3 640 380)"/>
    <polygon points="640,180 900,300 780,600 500,560 470,320" stroke="rgba(250,246,236,0.24)" stroke-width="2" transform="translate(20 12) rotate(1.4 640 380)"/>
  </g>
  <!-- 原型（くっきりした輪郭を保つ一枚） -->
  <polygon points="640,180 900,300 780,600 500,560 470,320" fill="url(#core1)" stroke="#FAF6EC" stroke-width="4" stroke-linejoin="round"/>
  <!-- 内側の判断基準の芯 -->
  <polygon points="640,300 760,360 715,500 565,478 550,370" fill="none" stroke="rgba(21,26,51,0.5)" stroke-width="3"/>
  <circle cx="648" cy="400" r="10" fill="#1E2340"/>
  <!-- 剥がれ落ちる模倣の断片 -->
  <g fill="rgba(250,246,236,0.14)">
    <rect x="980" y="150" width="70" height="46" rx="4" transform="rotate(-16 1015 173)"/>
    <rect x="150" y="600" width="58" height="40" rx="4" transform="rotate(20 179 620)"/>
  </g>
  <!-- 粒子 -->
  <g fill="rgba(250,246,236,0.55)">
    <circle cx="300" cy="180" r="2.4"/>
    <circle cx="1040" cy="560" r="2.6"/>
    <circle cx="200" cy="360" r="1.8"/>
    <circle cx="960" cy="640" r="2"/>
  </g>
</svg>
