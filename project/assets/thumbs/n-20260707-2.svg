<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 中心（顧客）を囲む同心の軌道。業種の異なる衛星（登壇企業）が、それぞれ意図された距離で配置される。ブランドは距離の設計 -->
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(200)">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="60%" stop-color="#243056"/>
      <stop offset="100%" stop-color="#3D5070"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A4C4" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#9B8CC8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- 同心の軌道（意図された距離の層） -->
  <g fill="none">
    <circle cx="600" cy="375" r="120" stroke="rgba(250,246,236,0.30)" stroke-width="1.5"/>
    <circle cx="600" cy="375" r="215" stroke="rgba(250,246,236,0.22)" stroke-width="1.5"/>
    <circle cx="600" cy="375" r="315" stroke="rgba(250,246,236,0.16)" stroke-width="1.5"/>
    <circle cx="600" cy="375" r="120" stroke="#7BBAD4" stroke-width="2" stroke-dasharray="3 12" opacity="0.55"/>
  </g>

  <!-- 中心（顧客） -->
  <circle cx="600" cy="375" r="230" fill="url(#hub)"/>
  <circle cx="600" cy="375" r="16" fill="rgba(250,246,236,0.95)"/>
  <circle cx="600" cy="375" r="30" fill="none" stroke="rgba(250,246,236,0.4)" stroke-width="1.5"/>

  <!-- 衛星（登壇企業）: 異なる形＝異なる業種。半径＝意図された距離 -->
  <!-- 近い軌道 -->
  <g>
    <line x1="600" y1="375" x2="504" y2="303" stroke="rgba(139,196,208,0.4)" stroke-width="1.2"/>
    <circle cx="504" cy="303" r="12" fill="#8CC4D0"/>
  </g>
  <!-- 中間軌道: 三角 -->
  <g>
    <line x1="600" y1="375" x2="790" y2="278" stroke="rgba(155,140,200,0.4)" stroke-width="1.2"/>
    <polygon points="790,262 804,288 776,288" fill="#9B8CC8"/>
  </g>
  <!-- 中間軌道: 四角 -->
  <g>
    <line x1="600" y1="375" x2="452" y2="530" stroke="rgba(155,140,200,0.4)" stroke-width="1.2"/>
    <rect x="440" y="518" width="26" height="26" rx="4" transform="rotate(18 453 531)" fill="#C8A4C4"/>
  </g>
  <!-- 遠い軌道: 大きな点 -->
  <g>
    <line x1="600" y1="375" x2="862" y2="548" stroke="rgba(123,186,212,0.35)" stroke-width="1.2"/>
    <circle cx="862" cy="548" r="14" fill="#7BBAD4"/>
  </g>
  <!-- 遠い軌道: 小さな菱形 -->
  <g>
    <line x1="600" y1="375" x2="336" y2="196" stroke="rgba(139,196,208,0.3)" stroke-width="1.2"/>
    <polygon points="336,180 352,196 336,212 320,196" fill="rgba(250,246,236,0.85)"/>
  </g>

  <!-- 余白の微粒子 -->
  <g fill="rgba(250,246,236,0.3)">
    <circle cx="150" cy="120" r="2"/><circle cx="1080" cy="150" r="2.5"/><circle cx="1010" cy="640" r="2"/>
    <circle cx="120" cy="620" r="2.2"/><circle cx="1130" cy="420" r="1.6"/><circle cx="90" cy="380" r="1.8"/>
  </g>
</svg>
