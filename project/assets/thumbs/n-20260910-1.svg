    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9B8CC8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
