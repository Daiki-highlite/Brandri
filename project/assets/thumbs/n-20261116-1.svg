<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="60%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#9B8CC8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C8A4C4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C8A4C4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <!-- 序列: 整然と並ぶ階段状の横帯 -->
  <g fill="rgba(250,246,236,0.12)">
    <rect x="140" y="150" width="420" height="34" rx="3"/>
    <rect x="140" y="214" width="370" height="34" rx="3"/>
    <rect x="140" y="278" width="320" height="34" rx="3"/>
    <rect x="140" y="342" width="270" height="34" rx="3"/>
    <rect x="140" y="406" width="220" height="34" rx="3"/>
    <rect x="140" y="470" width="170" height="34" rx="3"/>
    <rect x="140" y="534" width="120" height="34" rx="3"/>
  </g>
  <line x1="120" y1="130" x2="120" y2="600" stroke="rgba(250,246,236,0.35)" stroke-width="2"/>
  <!-- 列から抜け出す一本 -->
  <rect x="300" y="470" width="10" height="34" fill="#7BBAD4" opacity="0.9"/>
  <path d="M310 487 C 480 487, 620 420, 760 360" fill="none" stroke="#8CC4D0" stroke-width="2.5" stroke-dasharray="6 10" opacity="0.8"/>
  <!-- 自分で引いた新しい物差し（垂直軸と目盛り） -->
  <circle cx="860" cy="340" r="230" fill="url(#glow)"/>
  <line x1="860" y1="90" x2="860" y2="640" stroke="rgba(250,246,236,0.7)" stroke-width="3"/>
  <g stroke="rgba(250,246,236,0.5)" stroke-width="2">
    <line x1="840" y1="140" x2="880" y2="140"/><line x1="848" y1="190" x2="872" y2="190"/>
    <line x1="840" y1="240" x2="880" y2="240"/><line x1="848" y1="290" x2="872" y2="290"/>
    <line x1="840" y1="390" x2="880" y2="390"/><line x1="848" y1="440" x2="872" y2="440"/>
    <line x1="840" y1="490" x2="880" y2="490"/><line x1="848" y1="540" x2="872" y2="540"/>
    <line x1="840" y1="590" x2="880" y2="590"/>
  </g>
  <circle cx="860" cy="340" r="120" fill="none" stroke="#C8A4C4" stroke-width="1.5" opacity="0.6"/>
  <circle cx="860" cy="340" r="70" fill="none" stroke="#7BBAD4" stroke-width="1.5" opacity="0.7"/>
  <circle cx="860" cy="340" r="26" fill="rgba(250,246,236,0.9)"/>
  <g fill="rgba(250,246,236,0.5)">
    <circle cx="1010" cy="160" r="2"/><circle cx="1080" cy="520" r="1.6"/><circle cx="690" cy="610" r="1.8"/><circle cx="980" cy="640" r="1.4"/><circle cx="1110" cy="300" r="1.5"/>
  </g>
</svg>
