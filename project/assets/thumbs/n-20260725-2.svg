<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 対立していた二方向の線が、中央の一点で交わり合意になる（論敵の一致＝前提） -->
  <defs>
    <linearGradient id="bg2" gradientTransform="rotate(210)">
      <stop offset="0%" stop-color="#3D5070"/>
      <stop offset="55%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#151A33"/>
    </linearGradient>
    <radialGradient id="node2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A4C4" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#9B8CC8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <!-- 左陣営から中央へ集まる線 -->
  <g stroke="#7BBAD4" stroke-width="3" fill="none" opacity="0.75">
    <path d="M60 120 Q340 300 600 375"/>
    <path d="M60 300 Q360 340 600 375"/>
    <path d="M60 500 Q360 420 600 375"/>
    <path d="M60 660 Q340 470 600 375"/>
  </g>
  <!-- 右陣営から中央へ集まる線 -->
  <g stroke="#C8A4C4" stroke-width="3" fill="none" opacity="0.75">
    <path d="M1140 120 Q860 300 600 375"/>
    <path d="M1140 300 Q840 340 600 375"/>
    <path d="M1140 500 Q840 420 600 375"/>
    <path d="M1140 660 Q860 470 600 375"/>
  </g>
  <!-- 一致の一点（前提として据わる土台） -->
  <circle cx="600" cy="375" r="150" fill="url(#node2)"/>
  <circle cx="600" cy="375" r="46" fill="rgba(250,246,236,0.9)"/>
  <circle cx="600" cy="375" r="78" fill="none" stroke="rgba(250,246,236,0.35)" stroke-width="2"/>
  <!-- 据わった土台を示す水平の帯 -->
  <line x1="360" y1="375" x2="840" y2="375" stroke="rgba(250,246,236,0.18)" stroke-width="1.5"/>
</svg>
