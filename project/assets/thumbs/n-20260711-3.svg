<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 同じ形が接点ごとに等間隔で反復し、同じ波が返る（体験の一貫性＝選ばれ続ける） -->
  <defs>
    <linearGradient id="bg3" gradientTransform="rotate(200)">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="55%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#8CC4D0"/>
    </linearGradient>
    <radialGradient id="node3">
      <stop offset="0%" stop-color="#FAF6EC" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#8CC4D0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8CC4D0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg3)"/>
  <!-- 一貫の基準線（接点を貫く一本） -->
  <line x1="120" y1="375" x2="1080" y2="375" stroke="rgba(250,246,236,0.5)" stroke-width="2"/>
  <!-- 等間隔で反復する同一の接点（どこでも同じ約束が返る） -->
  <g>
    <!-- 接点1 -->
    <circle cx="300" cy="375" r="60" fill="url(#node3)"/>
    <circle cx="300" cy="375" r="60" fill="none" stroke="rgba(250,246,236,0.75)" stroke-width="2"/>
    <circle cx="300" cy="375" r="34" fill="none" stroke="rgba(250,246,236,0.5)" stroke-width="1.4"/>
    <circle cx="300" cy="375" r="9" fill="#FAF6EC"/>
    <!-- 接点2 -->
    <circle cx="600" cy="375" r="60" fill="url(#node3)"/>
    <circle cx="600" cy="375" r="60" fill="none" stroke="rgba(250,246,236,0.75)" stroke-width="2"/>
    <circle cx="600" cy="375" r="34" fill="none" stroke="rgba(250,246,236,0.5)" stroke-width="1.4"/>
    <circle cx="600" cy="375" r="9" fill="#FAF6EC"/>
    <!-- 接点3 -->
    <circle cx="900" cy="375" r="60" fill="url(#node3)"/>
    <circle cx="900" cy="375" r="60" fill="none" stroke="rgba(250,246,236,0.75)" stroke-width="2"/>
    <circle cx="900" cy="375" r="34" fill="none" stroke="rgba(250,246,236,0.5)" stroke-width="1.4"/>
    <circle cx="900" cy="375" r="9" fill="#FAF6EC"/>
  </g>
  <!-- 同じ波形が各接点から等しく返る（返ってくる約束） -->
  <g fill="none" stroke="rgba(155,140,200,0.5)" stroke-width="1.4">
    <circle cx="300" cy="375" r="112"/>
    <circle cx="600" cy="375" r="112"/>
    <circle cx="900" cy="375" r="112"/>
  </g>
  <g fill="none" stroke="rgba(123,186,212,0.32)" stroke-width="1">
    <circle cx="300" cy="375" r="150"/>
    <circle cx="600" cy="375" r="150"/>
    <circle cx="900" cy="375" r="150"/>
  </g>
  <!-- 粒子 -->
  <g fill="rgba(250,246,236,0.5)">
    <circle cx="180" cy="180" r="2.2"/>
    <circle cx="1020" cy="560" r="2.4"/>
    <circle cx="450" cy="620" r="1.8"/>
    <circle cx="760" cy="150" r="2"/>
  </g>
</svg>
