<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <!-- 抽象: 色調も大きさも異なる複数のレーベル（タイル）が、一本の「選ぶ基準」の線に貫かれて束ねられる。器からブランドへ -->
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(150)">
      <stop offset="0%" stop-color="#2A2650"/>
      <stop offset="55%" stop-color="#1E2340"/>
      <stop offset="100%" stop-color="#151A33"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8CC4D0"/>
      <stop offset="100%" stop-color="#C8A4C4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- 一本の基準線（すべてを貫く選定基準） -->
  <path d="M150 610 C 380 470, 470 430, 640 375 S 950 240, 1060 150"
        fill="none" stroke="url(#thread)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M150 610 C 380 470, 470 430, 640 375 S 950 240, 1060 150"
        fill="none" stroke="rgba(250,246,236,0.25)" stroke-width="12" stroke-linecap="round"/>

  <!-- 異なるレーベル（タイル）: 大きさ・角度・色を変えて多様性を出し、線が貫く -->
  <g>
    <rect x="205" y="520" width="150" height="150" rx="8" transform="rotate(-10 280 595)"
          fill="#3D5070" opacity="0.9" stroke="rgba(250,246,236,0.35)" stroke-width="1.5"/>
    <rect x="380" y="430" width="115" height="115" rx="8" transform="rotate(6 437 487)"
          fill="#9B8CC8" opacity="0.9" stroke="rgba(250,246,236,0.4)" stroke-width="1.5"/>
    <rect x="560" y="315" width="175" height="175" rx="8" transform="rotate(-5 647 402)"
          fill="rgba(250,246,236,0.14)" stroke="rgba(250,246,236,0.5)" stroke-width="1.5"/>
    <rect x="770" y="235" width="120" height="120" rx="8" transform="rotate(10 830 295)"
          fill="#7BBAD4" opacity="0.85" stroke="rgba(250,246,236,0.4)" stroke-width="1.5"/>
    <rect x="930" y="120" width="140" height="140" rx="8" transform="rotate(-8 1000 190)"
          fill="#C8A4C4" opacity="0.85" stroke="rgba(250,246,236,0.4)" stroke-width="1.5"/>
  </g>

  <!-- 各タイルが線に留まる結び目 -->
  <g fill="rgba(250,246,236,0.95)">
    <circle cx="280" cy="595" r="7"/><circle cx="437" cy="487" r="7"/>
    <circle cx="647" cy="402" r="8"/><circle cx="830" cy="295" r="7"/><circle cx="1000" cy="190" r="7"/>
  </g>

  <!-- 余白の微粒子 -->
  <g fill="rgba(250,246,236,0.28)">
    <circle cx="120" cy="180" r="2.2"/><circle cx="1120" cy="560" r="2.4"/><circle cx="180" cy="380" r="1.8"/>
    <circle cx="1080" cy="420" r="1.6"/><circle cx="520" cy="640" r="2"/><circle cx="700" cy="120" r="1.8"/>
  </g>
</svg>
