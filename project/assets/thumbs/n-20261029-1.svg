<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="g" gradientTransform="rotate(110)">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="60%" stop-color="#3D5070"/>
      <stop offset="100%" stop-color="#7BBAD4"/>
    </linearGradient>
    <radialGradient id="l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B8CC8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8CC4D0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8CC4D0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#g)"/>
  <!-- two perspectives -->
  <circle cx="470" cy="375" r="250" fill="url(#l)"/>
  <circle cx="730" cy="375" r="250" fill="url(#r)"/>
  <circle cx="470" cy="375" r="200" fill="none" stroke="#C8A4C4" stroke-width="2" opacity="0.7"/>
  <circle cx="730" cy="375" r="200" fill="none" stroke="#8CC4D0" stroke-width="2" opacity="0.7"/>
  <!-- shared lens -->
  <path d="M600 213 A200 200 0 0 1 600 537 A200 200 0 0 1 600 213 Z" fill="rgba(250,246,236,0.16)" stroke="rgba(250,246,236,0.6)" stroke-width="1.5"/>
  <!-- the promise: a single thread running through both -->
  <line x1="150" y1="375" x2="1050" y2="375" stroke="rgba(250,246,236,0.75)" stroke-width="2"/>
  <circle cx="600" cy="375" r="10" fill="rgba(250,246,236,0.95)"/>
  <circle cx="600" cy="375" r="26" fill="none" stroke="rgba(250,246,236,0.5)" stroke-width="1.5"/>
  <!-- differing vocabularies converging -->
  <g fill="rgba(250,246,236,0.55)">
    <rect x="300" y="300" width="70" height="4"/><rect x="290" y="320" width="90" height="4"/><rect x="310" y="340" width="55" height="4"/>
    <rect x="300" y="410" width="80" height="4"/><rect x="315" y="430" width="50" height="4"/>
  </g>
  <g fill="rgba(250,246,236,0.55)">
    <circle cx="840" cy="305" r="4"/><circle cx="868" cy="320" r="3"/><circle cx="850" cy="340" r="5"/>
    <circle cx="880" cy="415" r="4"/><circle cx="845" cy="432" r="3"/>
  </g>
  <circle cx="160" cy="120" r="1.6" fill="rgba(250,246,236,0.4)"/>
  <circle cx="1040" cy="640" r="2" fill="rgba(250,246,236,0.35)"/>
  <circle cx="980" cy="110" r="1.4" fill="rgba(250,246,236,0.3)"/>
  <circle cx="230" cy="640" r="1.8" fill="rgba(250,246,236,0.3)"/>
</svg>
